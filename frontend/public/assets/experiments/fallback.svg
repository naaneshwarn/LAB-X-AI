<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="fallbackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="400" rx="16" fill="url(#fallbackBg)" />

  <!-- Grid overlay for lab graph aesthetic -->
  <g stroke="#CBD5E1" stroke-width="1" opacity="0.35">
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
    <line x1="560" y1="0" x2="560" y2="400" />
    <line x1="0" y1="80" x2="640" y2="80" />
    <line x1="0" y1="160" x2="640" y2="160" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="320" x2="640" y2="320" />
  </g>

  <!-- Atom Orbital (Physics / Chemistry) -->
  <g transform="translate(180, 200)" stroke="#6366F1" stroke-width="2.5" fill="none" opacity="0.8">
    <ellipse cx="0" cy="0" rx="70" ry="24" transform="rotate(0)" />
    <ellipse cx="0" cy="0" rx="70" ry="24" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="70" ry="24" transform="rotate(120)" />
    <circle cx="0" cy="0" r="14" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="55" cy="18" r="5" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="-50" cy="-22" r="5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="10" cy="-62" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <!-- Erlenmeyer Flask (Chemistry) -->
  <g transform="translate(320, 140)">
    <!-- Flask Outline -->
    <path d="M-18,-60 L18,-60 L18,-35 L55,45 C60,56 52,68 40,68 L-40,68 C-52,68 -60,56 -55,45 L-18,-35 Z"
          fill="#FFFFFF" stroke="#0F172A" stroke-width="4" stroke-linejoin="round" />
    <!-- Liquid -->
    <path d="M-36,25 C-15,20 15,30 36,25 L40,64 C40,66 38,66 36,66 L-36,66 C-38,66 -40,66 -40,64 Z"
          fill="url(#flaskGrad)" opacity="0.85" />
    <!-- Bubbles -->
    <circle cx="-10" cy="40" r="4" fill="#FFFFFF" opacity="0.8" />
    <circle cx="15" cy="50" r="3" fill="#FFFFFF" opacity="0.8" />
    <circle cx="5" cy="15" r="5" fill="#38BDF8" opacity="0.7" />
    <circle cx="-12" cy="-5" r="3" fill="#38BDF8" opacity="0.7" />
  </g>

  <!-- Microscope / Biology element -->
  <g transform="translate(460, 200)" stroke="#0F172A" stroke-width="3" fill="none">
    <!-- Stand -->
    <path d="M -30,60 L 30,60 M 0,60 L 0,20 C 0,-15 25,-15 25,-40" stroke-width="4" stroke-linecap="round" />
    <!-- Stage -->
    <line x1="-35" y1="20" x2="15" y2="20" stroke-width="4" stroke-linecap="round" />
    <!-- Eyepiece Tube -->
    <rect x="18" y="-70" width="14" height="40" rx="3" transform="rotate(15 25 -50)" fill="#10B981" />
    <!-- Objective lens -->
    <rect x="12" y="-20" width="10" height="16" rx="2" fill="#047857" />
  </g>

  <!-- Banner text / watermark -->
  <rect x="230" y="315" width="180" height="34" rx="17" fill="#0F172A" opacity="0.85" />
  <text x="320" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">
    VIRTUAL SCIENCE LAB
  </text>
</svg>
