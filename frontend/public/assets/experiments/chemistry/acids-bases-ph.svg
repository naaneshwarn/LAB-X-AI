<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="phscale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="30%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="65%" stop-color="#22C55E"/>
      <stop offset="85%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#065F46">Acids, Bases &amp; the pH Scale</text>
  <!-- pH scale bar -->
  <rect x="40" y="60" width="560" height="52" rx="8" fill="url(#phscale)"/>
  <!-- pH numbers -->
  <text x="40" y="128" font-size="12" font-weight="700" fill="#B91C1C">0</text>
  <text x="90" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#D97706">2</text>
  <text x="145" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#D97706">4</text>
  <text x="200" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#CA8A04">6</text>
  <text x="264" y="128" text-anchor="middle" font-size="13" font-weight="800" fill="#059669">7</text>
  <text x="320" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#0369A1">8</text>
  <text x="380" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">10</text>
  <text x="440" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">12</text>
  <text x="500" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">14</text>
  <text x="38" y="54" font-size="10" fill="white" font-weight="700">←Acid</text>
  <text x="490" y="54" font-size="10" fill="white" font-weight="700">Base→</text>
  <text x="248" y="54" font-size="10" fill="white" font-weight="700">Neutral</text>
  <!-- pH test tubes -->
  <!-- pH 1 - red acid -->
  <rect x="58" y="148" width="40" height="90" rx="4" fill="#FEF2F2" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="60" y="190" width="36" height="46" rx="3" fill="#EF4444" fill-opacity="0.85"/>
  <ellipse cx="78" cy="238" rx="18" ry="4" fill="#B91C1C" fill-opacity="0.7"/>
  <text x="78" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#B91C1C">pH 1</text>
  <text x="78" y="272" text-anchor="middle" font-size="9" fill="#374151">HCl</text>
  <!-- pH 4 - orange -->
  <rect x="136" y="148" width="40" height="90" rx="4" fill="#FEF2F2" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="138" y="202" width="36" height="34" rx="3" fill="#FB923C" fill-opacity="0.85"/>
  <text x="156" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#EA580C">pH 4</text>
  <text x="156" y="272" text-anchor="middle" font-size="9" fill="#374151">Lemon</text>
  <!-- pH 7 - green -->
  <rect x="250" y="148" width="40" height="90" rx="4" fill="#FEF2F2" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="252" y="210" width="36" height="26" rx="3" fill="#34D399" fill-opacity="0.85"/>
  <text x="270" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">pH 7</text>
  <text x="270" y="272" text-anchor="middle" font-size="9" fill="#374151">Water</text>
  <!-- pH 10 - blue -->
  <rect x="368" y="148" width="40" height="90" rx="4" fill="#FEF2F2" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="370" y="195" width="36" height="41" rx="3" fill="#60A5FA" fill-opacity="0.85"/>
  <text x="388" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">pH 10</text>
  <text x="388" y="272" text-anchor="middle" font-size="9" fill="#374151">Soap</text>
  <!-- pH 13 - violet -->
  <rect x="478" y="148" width="40" height="90" rx="4" fill="#FEF2F2" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="480" y="175" width="36" height="61" rx="3" fill="#A78BFA" fill-opacity="0.85"/>
  <text x="498" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#6D28D9">pH 13</text>
  <text x="498" y="272" text-anchor="middle" font-size="9" fill="#374151">NaOH</text>
  <!-- Formula -->
  <rect x="80" y="295" width="480" height="80" rx="12" fill="white" fill-opacity="0.9" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="320" y="318" text-anchor="middle" font-size="13" font-weight="800" fill="#065F46">pH Calculations</text>
  <text x="220" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">pH = −log₁₀[H⁺]</text>
  <text x="430" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#6D28D9">pOH = −log₁₀[OH⁻]</text>
  <text x="320" y="362" text-anchor="middle" font-size="12" fill="#374151">pH + pOH = 14   |   Kw = [H⁺][OH⁻] = 10⁻¹⁴</text>
</svg>