  <text x="525" y="274" text-anchor="middle" font-size="10" fill="#166534">↑ Periods: more shells</text>
  <text x="525" y="290" text-anchor="middle" font-size="10" fill="#166534">→ Groups: same valence</text>
  <text x="525" y="306" text-anchor="middle" font-size="10" fill="#166534">EN increases → and ↑</text>
