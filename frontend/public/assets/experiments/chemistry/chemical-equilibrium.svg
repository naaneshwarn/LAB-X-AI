<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <marker id="fa" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="fb" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#EF4444"/></marker>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#C2410C">Chemical Equilibrium</text>
  <!-- Reaction equation -->
  <rect x="80" y="44" width="480" height="48" rx="10" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="320" y="66" text-anchor="middle" font-size="14" font-weight="800" fill="#C2410C">N₂ + 3H₂ ⇌ 2NH₃</text>
  <text x="320" y="84" text-anchor="middle" font-size="11" fill="#EA580C">Haber Process — Forward and Reverse reactions at equilibrium</text>
  <!-- Forward / Reverse arrows (large) -->
  <path d="M160,155 Q320,120 480,155" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#fa)"/>
  <text x="320" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">Forward rate kf</text>
  <path d="M480,195 Q320,230 160,195" fill="none" stroke="#EF4444" stroke-width="4" marker-end="url(#fb)"/>
  <text x="320" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">Reverse rate kr</text>
  <!-- Equilibrium label -->
  <circle cx="320" cy="175" r="40" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="320" y="170" text-anchor="middle" font-size="11" font-weight="800" fill="#92400E">Equil.</text>
  <text x="320" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">kf = kr</text>
  <!-- Concentration graph -->
  <rect x="40" y="265" width="210" height="118" rx="10" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <line x1="58" y1="368" x2="232" y2="368" stroke="#374151" stroke-width="1.5"/>
  <line x1="58" y1="280" x2="58" y2="368" stroke="#374151" stroke-width="1.5"/>
  <path d="M68,295 Q120,295 150,315 Q170,330 190,340 L230,340" fill="none" stroke="#EF4444" stroke-width="2.5"/>
  <text x="200" y="336" font-size="9" fill="#B91C1C">Reactants</text>
  <path d="M68,368 Q120,368 150,350 Q170,340 190,332 L230,332" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <text x="200" y="328" font-size="9" fill="#1D4ED8">Products</text>
  <text x="135" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">Conc. vs Time</text>
  <line x1="175" y1="275" x2="175" y2="368" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="175" y="390" text-anchor="middle" font-size="9" fill="#374151">equilib →</text>
  <!-- Le Chatelier's Principle -->
  <rect x="280" y="265" width="340" height="118" rx="10" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="450" y="288" text-anchor="middle" font-size="12" font-weight="800" fill="#C2410C">Le Chatelier's Principle</text>
  <text x="450" y="310" text-anchor="middle" font-size="11" fill="#374151">System opposes any change imposed</text>
  <text x="450" y="330" text-anchor="middle" font-size="11" fill="#2563EB">↑ Pressure → shifts towards fewer moles</text>
  <text x="450" y="350" text-anchor="middle" font-size="11" fill="#EF4444">↑ Temp → shifts endothermic direction</text>
  <text x="450" y="370" text-anchor="middle" font-size="11" fill="#16A34A">Kc = [NH₃]² / [N₂][H₂]³</text>
</svg>