<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#C2410C">Chemical Reaction Balancing</text>
  <!-- Combustion equation display -->
  <rect x="40" y="50" width="560" height="70" rx="12" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="2"/>
  <text x="320" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#C2410C">CH₄ + 2O₂ → CO₂ + 2H₂O</text>
  <text x="320" y="102" text-anchor="middle" font-size="12" fill="#EA580C">Combustion of Methane — Balanced</text>
  <!-- Atom count grid -->
  <rect x="40" y="140" width="560" height="130" rx="12" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="320" y="162" text-anchor="middle" font-size="13" font-weight="800" fill="#1E293B">Atom Count Verification</text>
  <!-- Headers -->
  <text x="160" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Atom</text>
  <text x="280" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Reactants</text>
  <text x="400" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Products</text>
  <text x="520" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Balanced?</text>
  <line x1="60" y1="192" x2="580" y2="192" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Carbon row -->
  <text x="160" y="210" text-anchor="middle" font-size="12" fill="#374151">C</text>
  <text x="280" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">1</text>
  <text x="400" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">1</text>
  <text x="520" y="210" text-anchor="middle" font-size="13" font-weight="800" fill="#16A34A">✓</text>
  <!-- Hydrogen row -->
  <text x="160" y="232" text-anchor="middle" font-size="12" fill="#374151">H</text>
  <text x="280" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">4</text>
  <text x="400" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">4</text>
  <text x="520" y="232" text-anchor="middle" font-size="13" font-weight="800" fill="#16A34A">✓</text>
  <!-- Oxygen row -->
  <text x="160" y="254" text-anchor="middle" font-size="12" fill="#374151">O</text>
  <text x="280" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">4</text>
  <text x="400" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">4</text>
  <text x="520" y="254" text-anchor="middle" font-size="13" font-weight="800" fill="#16A34A">✓</text>
  <!-- Balance scale -->
  <line x1="320" y1="295" x2="320" y2="360" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="320" cy="295" r="6" fill="#475569"/>
  <line x1="200" y1="330" x2="440" y2="330" stroke="#374151" stroke-width="4"/>
  <!-- Left pan -->
  <ellipse cx="210" cy="338" rx="40" ry="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="210" y1="330" x2="210" y2="338" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="210" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">Reactants</text>
  <!-- Right pan -->
  <ellipse cx="430" cy="338" rx="40" ry="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="430" y1="330" x2="430" y2="338" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="430" y="354" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">Products</text>
  <!-- Conservation law -->
  <rect x="80" y="358" width="480" height="28" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="320" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">Law of Conservation of Mass — Atoms are never created or destroyed</text>
</svg>