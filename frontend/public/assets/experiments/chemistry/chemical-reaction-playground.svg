<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#14532D">Virtual Chemistry Lab</text>
  <!-- Lab bench -->
  <rect x="20" y="310" width="600" height="22" rx="6" fill="#A8A29E"/>
  <rect x="20" y="326" width="600" height="10" rx="4" fill="#78716C"/>
  <!-- Conical flask (left) - reactant A -->
  <path d="M120,180 L150,180 L150,230 L190,300 L80,300 L120,230 Z" fill="#BFDBFE" fill-opacity="0.8" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="118" y="150" width="34" height="30" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <ellipse cx="135" cy="300" rx="55" ry="8" fill="#2563EB" fill-opacity="0.3"/>
  <!-- Bubbles in left flask -->
  <circle cx="118" cy="260" r="6" fill="#60A5FA" fill-opacity="0.7"/>
  <circle cx="130" cy="240" r="4" fill="#60A5FA" fill-opacity="0.7"/>
  <circle cx="145" cy="255" r="5" fill="#60A5FA" fill-opacity="0.7"/>
  <text x="135" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">HCl (aq)</text>
  <!-- Beaker (center) - reaction mixture -->
  <rect x="255" y="190" width="130" height="118" rx="6" fill="#FEF9C3" fill-opacity="0.9" stroke="#CA8A04" stroke-width="2.5"/>
  <rect x="262" y="250" width="116" height="56" rx="4" fill="#FCD34D" fill-opacity="0.7"/>
  <!-- Reaction bubbles -->
  <circle cx="295" cy="230" r="7" fill="#A3E635" fill-opacity="0.8"/>
  <circle cx="320" cy="218" r="5" fill="#A3E635" fill-opacity="0.8"/>
  <circle cx="345" cy="225" r="6" fill="#A3E635" fill-opacity="0.8"/>
  <text x="320" y="175" text-anchor="middle" font-size="13" font-weight="800" fill="#92400E">Reaction!</text>
  <text x="320" y="192" text-anchor="middle" font-size="10" fill="#A16207">NaCl + H₂O + CO₂↑</text>
  <text x="320" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#D97706">Products (↑ gas)</text>
  <!-- Conical flask (right) - reactant B -->
  <path d="M490,180 L520,180 L520,230 L560,300 L450,300 L490,230 Z" fill="#DCFCE7" fill-opacity="0.8" stroke="#16A34A" stroke-width="2.5"/>
  <rect x="488" y="150" width="34" height="30" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <ellipse cx="505" cy="300" rx="55" ry="8" fill="#16A34A" fill-opacity="0.3"/>
  <text x="505" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">NaHCO₃</text>
  <!-- Bunsen burner -->
  <rect x="296" y="300" width="48" height="14" rx="3" fill="#374151"/>
  <rect x="308" y="290" width="24" height="14" rx="3" fill="#475569"/>
  <path d="M320,278 Q314,268 320,255 Q326,268 320,278 Z" fill="#FB923C" fill-opacity="0.9"/>
  <path d="M320,268 Q316,262 320,255 Q324,262 320,268 Z" fill="#FBBF24"/>
  <!-- Arrow between flasks -->
  <line x1="195" y1="240" x2="250" y2="240" stroke="#374151" stroke-width="2.5"/>
  <polygon points="244,232 258,240 244,248" fill="#374151"/>
  <line x1="390" y1="240" x2="445" y2="240" stroke="#374151" stroke-width="2.5"/>
  <polygon points="438,232 452,240 438,248" fill="#374151"/>
  <!-- Thermometer -->
  <rect x="410" y="192" width="10" height="80" rx="5" fill="#FEF2F2" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="413" y="232" width="4" height="38" rx="2" fill="#EF4444"/>
  <circle cx="415" cy="272" r="8" fill="#EF4444" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="430" y="250" font-size="10" font-weight="700" fill="#B91C1C">72°C</text>
  <!-- Lab equation -->
  <rect x="80" y="358" width="480" height="30" rx="8" fill="white" fill-opacity="0.9" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="320" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">HCl + NaHCO₃ → NaCl + H₂O + CO₂↑  (Acid + Carbonate)</text>
</svg>