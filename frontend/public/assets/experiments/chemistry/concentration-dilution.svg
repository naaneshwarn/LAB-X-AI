<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#1E3A8A">Solution Concentration &amp; Dilution</text>
  <!-- Concentrated beaker (left) -->
  <rect x="60" y="90" width="120" height="160" rx="6" fill="#93C5FD" fill-opacity="0.8" stroke="#2563EB" stroke-width="2.5"/>
  <ellipse cx="120" cy="90" rx="60" ry="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <ellipse cx="120" cy="250" rx="60" ry="12" fill="#1D4ED8" fill-opacity="0.5"/>
  <!-- Many solute particles -->
  <circle cx="85" cy="120" r="6" fill="#1D4ED8"/><circle cx="110" cy="110" r="6" fill="#1D4ED8"/><circle cx="140" cy="118" r="6" fill="#1D4ED8"/>
  <circle cx="92" cy="145" r="6" fill="#1D4ED8"/><circle cx="122" cy="138" r="6" fill="#1D4ED8"/><circle cx="152" cy="148" r="6" fill="#1D4ED8"/>
  <circle cx="80" cy="170" r="6" fill="#1D4ED8"/><circle cx="108" cy="162" r="6" fill="#1D4ED8"/><circle cx="138" cy="172" r="6" fill="#1D4ED8"/>
  <circle cx="162" cy="165" r="6" fill="#1D4ED8"/>
  <circle cx="88" cy="195" r="6" fill="#1D4ED8"/><circle cx="120" cy="188" r="6" fill="#1D4ED8"/><circle cx="150" cy="195" r="6" fill="#1D4ED8"/>
  <circle cx="96" cy="220" r="6" fill="#1D4ED8"/><circle cx="128" cy="215" r="6" fill="#1D4ED8"/>
  <text x="120" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">Concentrated</text>
  <text x="120" y="295" text-anchor="middle" font-size="12" font-weight="800" fill="#1E3A8A">M₁ = 2.0 M</text>
  <text x="120" y="313" text-anchor="middle" font-size="10" fill="#374151">V₁ = 100 mL</text>
  <!-- Arrow with water drop -->
  <line x1="195" y1="175" x2="285" y2="175" stroke="#374151" stroke-width="2.5"/>
  <polygon points="278,167 294,175 278,183" fill="#374151"/>
  <text x="240" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">+ Water</text>
  <ellipse cx="240" cy="192" rx="10" ry="12" fill="#93C5FD"/>
  <!-- Diluted beaker (right) -->
  <rect x="300" y="90" width="175" height="160" rx="6" fill="#BAE6FD" fill-opacity="0.6" stroke="#38BDF8" stroke-width="2.5"/>
  <ellipse cx="388" cy="90" rx="88" ry="12" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/>
  <ellipse cx="388" cy="250" rx="88" ry="12" fill="#38BDF8" fill-opacity="0.3"/>
  <!-- Few solute particles (diluted) -->
  <circle cx="330" cy="120" r="6" fill="#1D4ED8"/><circle cx="370" cy="130" r="6" fill="#1D4ED8"/>
  <circle cx="410" cy="115" r="6" fill="#1D4ED8"/><circle cx="452" cy="125" r="6" fill="#1D4ED8"/>
  <circle cx="345" cy="162" r="6" fill="#1D4ED8"/><circle cx="390" cy="155" r="6" fill="#1D4ED8"/>
  <circle cx="435" cy="168" r="6" fill="#1D4ED8"/>
  <circle cx="318" cy="200" r="6" fill="#1D4ED8"/><circle cx="362" cy="195" r="6" fill="#1D4ED8"/>
  <circle cx="405" cy="205" r="6" fill="#1D4ED8"/><circle cx="460" cy="197" r="6" fill="#1D4ED8"/>
  <circle cx="335" cy="232" r="6" fill="#1D4ED8"/><circle cx="388" cy="228" r="6" fill="#1D4ED8"/>
  <text x="388" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#0369A1">Diluted</text>
  <text x="388" y="295" text-anchor="middle" font-size="12" font-weight="800" fill="#1E3A8A">M₂ = 0.5 M</text>
  <text x="388" y="313" text-anchor="middle" font-size="10" fill="#374151">V₂ = 400 mL</text>
  <!-- Dilution law box -->
  <rect x="500" y="110" width="120" height="90" rx="10" fill="#1D4ED8"/>
  <text x="560" y="135" text-anchor="middle" font-size="13" font-weight="800" fill="white">M₁V₁ = M₂V₂</text>
  <text x="560" y="156" text-anchor="middle" font-size="11" fill="#BAE6FD">Dilution Law</text>
  <text x="560" y="176" text-anchor="middle" font-size="10" fill="#93C5FD">Moles of solute</text>
  <text x="560" y="192" text-anchor="middle" font-size="10" fill="#93C5FD">are conserved</text>
  <!-- Concentration formula -->
  <rect x="80" y="335" width="480" height="50" rx="10" fill="white" fill-opacity="0.9" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="320" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Molarity M = n / V(L)</text>
  <text x="320" y="376" text-anchor="middle" font-size="11" fill="#374151">Moles of solute per litre of solution</text>
</svg>