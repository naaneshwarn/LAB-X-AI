<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#14532D">Chemical Bonding</text>
  <!-- IONIC bond (left) -->
  <rect x="20" y="52" width="270" height="260" rx="12" fill="white" fill-opacity="0.9" stroke="#A7F3D0" stroke-width="2"/>
  <text x="155" y="76" text-anchor="middle" font-size="13" font-weight="800" fill="#14532D">Ionic Bond (NaCl)</text>
  <!-- Na atom -->
  <circle cx="85" cy="160" r="38" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="85" y="156" text-anchor="middle" font-size="13" font-weight="800" fill="#92400E">Na</text>
  <text x="85" y="174" text-anchor="middle" font-size="10" fill="#D97706">loses e⁻</text>
  <!-- Electron transfer arrow -->
  <path d="M120,142 Q155,118 188,142" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#et)"/>
  <defs>
    <marker id="et" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#EF4444"/>
    </marker>
  </defs>
  <text x="155" y="128" text-anchor="middle" font-size="10" fill="#EF4444">e⁻ transfer</text>
  <!-- Cl atom -->
  <circle cx="225" cy="160" r="38" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="225" y="156" text-anchor="middle" font-size="13" font-weight="800" fill="#1D4ED8">Cl</text>
  <text x="225" y="174" text-anchor="middle" font-size="10" fill="#2563EB">gains e⁻</text>
  <!-- Charges -->
  <text x="85" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#D97706">Na⁺</text>
  <text x="225" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">Cl⁻</text>
  <!-- Crystal lattice hint -->
  <text x="155" y="225" text-anchor="middle" font-size="11" fill="#374151">Electrostatic attraction</text>
  <text x="155" y="243" text-anchor="middle" font-size="11" fill="#374151">forms ionic lattice</text>
  <text x="155" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">High MP · Conducts in liquid</text>
  <!-- COVALENT bond (right) -->
  <rect x="348" y="52" width="270" height="260" rx="12" fill="white" fill-opacity="0.9" stroke="#A7F3D0" stroke-width="2"/>
  <text x="483" y="76" text-anchor="middle" font-size="13" font-weight="800" fill="#14532D">Covalent Bond (H₂O)</text>
  <!-- O atom center -->
  <circle cx="483" cy="175" r="40" fill="#BFDBFE" stroke="#2563EB" stroke-width="2.5"/>
  <text x="483" y="171" text-anchor="middle" font-size="13" font-weight="800" fill="#1D4ED8">O</text>
  <text x="483" y="189" text-anchor="middle" font-size="10" fill="#2563EB">shared e⁻</text>
  <!-- H atoms -->
  <circle cx="400" cy="232" r="24" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="400" y="236" text-anchor="middle" font-size="12" font-weight="800" fill="#92400E">H</text>
  <circle cx="566" cy="232" r="24" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="566" y="236" text-anchor="middle" font-size="12" font-weight="800" fill="#92400E">H</text>
  <!-- Shared electron clouds -->
  <ellipse cx="442" cy="204" rx="22" ry="12" fill="#93C5FD" fill-opacity="0.5" transform="rotate(-35 442 204)"/>
  <ellipse cx="524" cy="204" rx="22" ry="12" fill="#93C5FD" fill-opacity="0.5" transform="rotate(35 524 204)"/>
  <!-- Bond angle -->
  <path d="M414,224 A45,45 0 0,1 552,224" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="483" y="260" text-anchor="middle" font-size="11" fill="#374151">104.5° bond angle</text>
  <text x="483" y="295" text-anchor="middle" font-size="11" fill="#374151">Polar covalent — bent shape</text>
  <!-- Electronegativity scale -->
  <rect x="80" y="330" width="480" height="52" rx="10" fill="white" fill-opacity="0.88" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="320" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">Δχ determines bond type</text>
  <text x="320" y="372" text-anchor="middle" font-size="11" fill="#374151">Δχ &lt; 0.5 → covalent  |  0.5–1.7 → polar covalent  |  &gt;1.7 → ionic</text>
</svg>