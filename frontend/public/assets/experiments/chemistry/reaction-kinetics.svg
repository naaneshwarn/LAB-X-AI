<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#4C1D95">Reaction Kinetics &amp; Rate Law</text>
  <!-- Energy profile diagram (left) -->
  <rect x="20" y="52" width="285" height="210" rx="12" fill="white" fill-opacity="0.9" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="163" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="#4C1D95">Energy Profile</text>
  <line x1="40" y1="240" x2="288" y2="240" stroke="#374151" stroke-width="1.5"/>
  <line x1="40" y1="80" x2="40" y2="244" stroke="#374151" stroke-width="1.5"/>
  <!-- Energy profile path -->
  <path d="M50,220 Q80,220 110,130 Q140,80 165,80 Q190,78 220,130 Q250,180 280,180" fill="none" stroke="#7C3AED" stroke-width="3"/>
  <!-- Reactant level -->
  <line x1="50" y1="220" x2="100" y2="220" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="62" y="236" font-size="9" font-weight="700" fill="#B91C1C">Reactants</text>
  <!-- Product level -->
  <line x1="240" y1="180" x2="286" y2="180" stroke="#059669" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="244" y="196" font-size="9" font-weight="700" fill="#059669">Products</text>
  <!-- Activation energy arrow -->
  <line x1="165" y1="220" x2="165" y2="84" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="172" y="150" font-size="9" font-weight="700" fill="#D97706">Ea</text>
  <!-- ΔH arrow -->
  <line x1="275" y1="220" x2="275" y2="184" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="278" y="204" font-size="9" font-weight="700" fill="#2563EB">ΔH</text>
  <!-- Concentration vs time graph (right) -->
  <rect x="335" y="52" width="285" height="210" rx="12" fill="white" fill-opacity="0.9" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="478" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="#4C1D95">[A] vs Time (1st Order)</text>
  <line x1="355" y1="244" x2="604" y2="244" stroke="#374151" stroke-width="1.5"/>
  <line x1="355" y1="80" x2="355" y2="248" stroke="#374151" stroke-width="1.5"/>
  <!-- Exponential decay curve -->
  <path d="M360,88 Q380,100 410,130 Q440,160 475,185 Q510,205 560,218 Q590,224 600,226" fill="none" stroke="#7C3AED" stroke-width="3"/>
  <text x="380" y="92" font-size="10" font-weight="700" fill="#6D28D9">[A]₀</text>
  <text x="490" y="184" font-size="9" font-weight="700" fill="#7C3AED">t₁/₂</text>
  <line x1="478" y1="90" x2="478" y2="244" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Formula bottom -->
  <rect x="20" y="275" width="600" height="108" rx="12" fill="white" fill-opacity="0.88" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="320" y="298" text-anchor="middle" font-size="13" font-weight="800" fill="#4C1D95">Rate Laws &amp; Arrhenius Equation</text>
  <text x="175" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">Rate = k[A]ⁿ[B]ᵐ</text>
  <text x="460" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">k = Ae^(−Ea/RT)</text>
  <text x="175" y="344" text-anchor="middle" font-size="11" fill="#374151">1st order: [A] = [A]₀e^(−kt)</text>
  <text x="460" y="344" text-anchor="middle" font-size="11" fill="#374151">Higher T → higher k → faster reaction</text>
  <text x="320" y="368" text-anchor="middle" font-size="11" fill="#374151">t₁/₂ = 0.693 / k</text>
</svg>