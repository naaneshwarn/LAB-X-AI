<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#9F1239">Electrochemical Cells &amp; Nernst Equation</text>
  <!-- Cell container -->
  <rect x="60" y="80" width="520" height="200" rx="12" fill="#FFF5F5" stroke="#FDA4AF" stroke-width="2"/>
  <!-- Salt bridge -->
  <rect x="275" y="68" width="90" height="28" rx="8" fill="#C4B5FD" stroke="#7C3AED" stroke-width="2"/>
  <text x="320" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#4C1D95">Salt Bridge KCl</text>
  <!-- Left half-cell: Zinc (anode) -->
  <rect x="80" y="110" width="160" height="150" rx="6" fill="#FEF9C3" fill-opacity="0.8" stroke="#CA8A04" stroke-width="1.5"/>
  <text x="160" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">Zn²⁺(aq)</text>
  <!-- Zinc electrode -->
  <rect x="145" y="100" width="30" height="120" rx="4" fill="#94A3B8" stroke="#64748B" stroke-width="2"/>
  <text x="160" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">Zn(s)</text>
  <text x="145" y="240" font-size="9" fill="#374151">ANODE (−)</text>
  <!-- Zn → ions -->
  <text x="88" y="165" font-size="9" fill="#D97706">Zn → Zn²⁺ + 2e⁻</text>
  <!-- Right half-cell: Copper (cathode) -->
  <rect x="400" y="110" width="160" height="150" rx="6" fill="#ECFDF5" fill-opacity="0.8" stroke="#16A34A" stroke-width="1.5"/>
  <text x="480" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">Cu²⁺(aq)</text>
  <!-- Copper electrode -->
  <rect x="465" y="100" width="30" height="120" rx="4" fill="#FB923C" stroke="#EA580C" stroke-width="2"/>
  <text x="480" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">Cu(s)</text>
  <text x="468" y="240" font-size="9" fill="#374151">CATHODE (+)</text>
  <text x="410" y="165" font-size="9" fill="#059669">Cu²⁺ + 2e⁻ → Cu</text>
  <!-- External wire with voltmeter -->
  <line x1="175" y1="100" x2="175" y2="58" stroke="#374151" stroke-width="2.5"/>
  <line x1="175" y1="58" x2="295" y2="58" stroke="#374151" stroke-width="2.5"/>
  <line x1="345" y1="58" x2="465" y2="58" stroke="#374151" stroke-width="2.5"/>
  <line x1="465" y1="58" x2="465" y2="100" stroke="#374151" stroke-width="2.5"/>
  <!-- Voltmeter -->
  <circle cx="320" cy="42" r="20" fill="white" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="320" y="38" text-anchor="middle" font-size="9" font-weight="800" fill="#6D28D9">V</text>
  <text x="320" y="52" text-anchor="middle" font-size="9" font-weight="700" fill="#6D28D9">1.10V</text>
  <!-- Electron flow arrow -->
  <line x1="195" y1="54" x2="290" y2="54" stroke="#2563EB" stroke-width="2"/>
  <polygon points="283,47 297,54 283,61" fill="#2563EB"/>
  <text x="244" y="45" text-anchor="middle" font-size="9" fill="#1D4ED8">e⁻ flow</text>
  <!-- Formula -->
  <rect x="80" y="302" width="480" height="80" rx="12" fill="white" fill-opacity="0.9" stroke="#FDA4AF" stroke-width="1.5"/>
  <text x="320" y="324" text-anchor="middle" font-size="13" font-weight="800" fill="#9F1239">Nernst Equation</text>
  <text x="320" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#BE123C">E = E° − (RT/nF) × ln(Q)</text>
  <text x="320" y="366" text-anchor="middle" font-size="11" fill="#374151">E°cell (Zn/Cu) = +1.10 V  |  ΔG = −nFE</text>
</svg>