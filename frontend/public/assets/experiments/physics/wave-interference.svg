<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#4C1D95">Wave Interference &amp; Double Slit</text>
  <!-- Double slit barrier -->
  <rect x="230" y="60" width="20" height="130" rx="3" fill="#374151"/>
  <rect x="230" y="210" width="20" height="50" rx="3" fill="#374151"/>
  <rect x="230" y="280" width="20" height="90" rx="3" fill="#374151"/>
  <!-- Slit labels -->
  <text x="225" y="200" text-anchor="end" font-size="11" font-weight="700" fill="#6D28D9">Slit 1</text>
  <text x="225" y="270" text-anchor="end" font-size="11" font-weight="700" fill="#6D28D9">Slit 2</text>
  <!-- Incoming waves (left) -->
  <path d="M50,200 Q80,180 110,200 Q140,220 170,200 Q200,180 230,200" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-dasharray="6,3"/>
  <path d="M50,220 Q80,200 110,220 Q140,240 170,220 Q200,200 230,220" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="6,3" opacity="0.5"/>
  <!-- Interference pattern on screen -->
  <rect x="560" y="60" width="20" height="310" rx="4" fill="#374151"/>
  <!-- Bright fringes (constructive) -->
  <rect x="542" y="62" width="20" height="28" rx="3" fill="#A78BFA" opacity="0.9"/>
  <rect x="542" y="124" width="20" height="28" rx="3" fill="#A78BFA" opacity="0.9"/>
  <rect x="542" y="186" width="20" height="28" rx="3" fill="#C4B5FD" opacity="0.9"/>
  <rect x="542" y="204" width="20" height="28" rx="3" fill="#A78BFA" opacity="0.95"/>
  <rect x="542" y="263" width="20" height="28" rx="3" fill="#A78BFA" opacity="0.9"/>
  <rect x="542" y="323" width="20" height="28" rx="3" fill="#A78BFA" opacity="0.9"/>
  <!-- Interference rays -->
  <line x1="250" y1="195" x2="560" y2="80" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
  <line x1="250" y1="195" x2="560" y2="140" stroke="#818CF8" stroke-width="1.5" opacity="0.4"/>
  <line x1="250" y1="195" x2="560" y2="215" stroke="#A78BFA" stroke-width="2" opacity="0.8"/>
  <line x1="250" y1="195" x2="560" y2="280" stroke="#818CF8" stroke-width="1.5" opacity="0.4"/>
  <line x1="250" y1="195" x2="560" y2="340" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
  <line x1="250" y1="265" x2="560" y2="80" stroke="#A78BFA" stroke-width="1.5" opacity="0.4"/>
  <line x1="250" y1="265" x2="560" y2="140" stroke="#818CF8" stroke-width="1.5" opacity="0.6"/>
  <line x1="250" y1="265" x2="560" y2="215" stroke="#A78BFA" stroke-width="2" opacity="0.8"/>
  <line x1="250" y1="265" x2="560" y2="280" stroke="#818CF8" stroke-width="1.5" opacity="0.4"/>
  <line x1="250" y1="265" x2="560" y2="340" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
  <!-- Formula -->
  <rect x="280" y="310" width="250" height="60" rx="10" fill="white" fill-opacity="0.92" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="405" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#4C1D95">Young's Double Slit</text>
  <text x="405" y="353" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">Δy = λL / d</text>
</svg>