<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#C2410C">Thermodynamic Processes &amp; PV Diagram</text>
  <!-- Axes -->
  <line x1="80" y1="310" x2="560" y2="310" stroke="#374151" stroke-width="2.5"/>
  <line x1="80" y1="60" x2="80" y2="310" stroke="#374151" stroke-width="2.5"/>
  <text x="310" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Volume (V)</text>
  <text x="38" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#374151" transform="rotate(-90,38,195)">Pressure (P)</text>
  <!-- Isothermal curve -->
  <path d="M120,80 Q220,120 350,180 Q440,220 530,290" fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="430" y="210" font-size="12" font-weight="700" fill="#B91C1C">Isothermal</text>
  <!-- Isobaric line -->
  <line x1="120" y1="160" x2="530" y2="160" stroke="#2563EB" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="430" y="150" font-size="12" font-weight="700" fill="#1D4ED8">Isobaric</text>
  <!-- Isochoric line -->
  <line x1="300" y1="80" x2="300" y2="295" stroke="#22C55E" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="310" y="90" font-size="12" font-weight="700" fill="#15803D">Isochoric</text>
  <!-- Adiabatic curve -->
  <path d="M120,65 Q200,130 280,210 Q360,280 400,300" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <text x="310" y="275" font-size="12" font-weight="700" fill="#D97706">Adiabatic</text>
  <!-- Piston illustration -->
  <rect x="460" y="60" width="80" height="120" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <rect x="470" y="90" width="60" height="8" rx="3" fill="#475569"/>
  <circle cx="500" cy="140" r="20" fill="#FB923C" fill-opacity="0.8"/>
  <text x="500" y="145" text-anchor="middle" font-size="10" font-weight="700" fill="white">Gas</text>
  <line x1="500" y1="90" x2="500" y2="45" stroke="#374151" stroke-width="4"/>
  <polygon points="492,45 500,32 508,45" fill="#374151"/>
  <!-- Formula -->
  <rect x="80" y="315" width="300" height="60" rx="10" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="230" y="337" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">PV = nRT  (Ideal Gas Law)</text>
  <text x="230" y="357" text-anchor="middle" font-size="12" fill="#EA580C">ΔU = Q − W (1st Law)</text>
</svg>