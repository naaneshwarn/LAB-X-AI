<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <!-- SERIES CIRCUIT (top) -->
  <text x="320" y="38" text-anchor="middle" font-size="18" font-weight="800" fill="#C2410C">Series &amp; Parallel Resistor Circuits</text>
  <text x="160" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#EA580C">Series Circuit</text>
  <!-- Series loop -->
  <rect x="40" y="72" width="260" height="110" rx="8" fill="none" stroke="#EA580C" stroke-width="3"/>
  <!-- Battery -->
  <rect x="22" y="105" width="36" height="44" rx="4" fill="#2563EB"/>
  <text x="40" y="130" text-anchor="middle" font-size="9" font-weight="800" fill="white">9V</text>
  <!-- R1 -->
  <rect x="92" y="60" width="60" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="122" y="75" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">R₁ 10Ω</text>
  <!-- R2 -->
  <rect x="192" y="60" width="60" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="222" y="75" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">R₂ 20Ω</text>
  <!-- Ammeter -->
  <circle cx="170" cy="182" r="14" fill="white" stroke="#EA580C" stroke-width="2"/>
  <text x="170" y="186" text-anchor="middle" font-size="9" font-weight="800" fill="#C2410C">A</text>
  <text x="160" y="208" text-anchor="middle" font-size="10" fill="#C2410C">I=0.3A</text>
  <!-- Series formula -->
  <rect x="42" y="195" width="234" height="30" rx="6" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="159" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">Rₜ = R₁+R₂+… = 30Ω</text>

  <!-- PARALLEL CIRCUIT (right) -->
  <text x="490" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#7C3AED">Parallel Circuit</text>
  <!-- Outer loop -->
  <rect x="348" y="72" width="260" height="110" rx="8" fill="none" stroke="#7C3AED" stroke-width="3"/>
  <!-- Battery -->
  <rect x="330" y="105" width="36" height="44" rx="4" fill="#2563EB"/>
  <text x="348" y="130" text-anchor="middle" font-size="9" font-weight="800" fill="white">9V</text>
  <!-- Parallel branch 1 -->
  <line x1="384" y1="72" x2="384" y2="182" stroke="#7C3AED" stroke-width="2"/>
  <rect x="390" y="90" width="60" height="22" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="420" y="105" text-anchor="middle" font-size="10" font-weight="700" fill="#5B21B6">R₁ 10Ω</text>
  <!-- Parallel branch 2 -->
  <line x1="496" y1="72" x2="496" y2="182" stroke="#7C3AED" stroke-width="2"/>
  <rect x="502" y="90" width="60" height="22" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="532" y="105" text-anchor="middle" font-size="10" font-weight="700" fill="#5B21B6">R₂ 20Ω</text>
  <!-- Parallel formula -->
  <rect x="348" y="195" width="260" height="30" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="478" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">1/Rₜ = 1/R₁+1/R₂ → 6.7Ω</text>

  <!-- Comparison table -->
  <rect x="80" y="250" width="480" height="120" rx="12" fill="white" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="275" text-anchor="middle" font-size="14" font-weight="800" fill="#1E293B">Series vs Parallel Comparison</text>
  <text x="175" y="300" text-anchor="middle" font-size="12" fill="#EA580C">Series: same I, V adds up</text>
  <text x="460" y="300" text-anchor="middle" font-size="12" fill="#7C3AED">Parallel: same V, I adds up</text>
  <text x="175" y="322" text-anchor="middle" font-size="12" fill="#EA580C">Total V = V₁+V₂</text>
  <text x="460" y="322" text-anchor="middle" font-size="12" fill="#7C3AED">Total I = I₁+I₂</text>
  <text x="175" y="344" text-anchor="middle" font-size="12" fill="#EA580C">Rₜ increases</text>
  <text x="460" y="344" text-anchor="middle" font-size="12" fill="#7C3AED">Rₜ decreases</text>
  <line x1="320" y1="285" x2="320" y2="355" stroke="#E2E8F0" stroke-width="1.5"/>
</svg>