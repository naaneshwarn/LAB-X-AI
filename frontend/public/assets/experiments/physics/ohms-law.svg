<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <!-- Circuit loop -->
  <rect x="80" y="140" width="480" height="130" rx="8" fill="none" stroke="#1D4ED8" stroke-width="4"/>
  <!-- Battery (left) -->
  <rect x="58" y="175" width="44" height="60" rx="6" fill="#2563EB"/>
  <line x1="66" y1="192" x2="94" y2="192" stroke="white" stroke-width="3"/>
  <line x1="70" y1="208" x2="90" y2="208" stroke="white" stroke-width="2"/>
  <line x1="66" y1="224" x2="94" y2="224" stroke="white" stroke-width="3"/>
  <text x="80" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#1D4ED8">12 V</text>
  <!-- Resistor (top) -->
  <rect x="240" y="120" width="160" height="36" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <line x1="258" y1="138" x2="276" y2="128" stroke="#B45309" stroke-width="2"/>
  <line x1="276" y1="128" x2="294" y2="148" stroke="#B45309" stroke-width="2"/>
  <line x1="294" y1="148" x2="312" y2="128" stroke="#B45309" stroke-width="2"/>
  <line x1="312" y1="128" x2="330" y2="148" stroke="#B45309" stroke-width="2"/>
  <line x1="330" y1="148" x2="348" y2="128" stroke="#B45309" stroke-width="2"/>
  <line x1="348" y1="128" x2="366" y2="148" stroke="#B45309" stroke-width="2"/>
  <line x1="366" y1="148" x2="384" y2="138" stroke="#B45309" stroke-width="2"/>
  <text x="320" y="175" text-anchor="middle" font-size="13" font-weight="800" fill="#92400E">100 Ω</text>
  <!-- LED bulb (right) -->
  <circle cx="560" cy="205" r="30" fill="#FEF08A" stroke="#EAB308" stroke-width="3"/>
  <line x1="548" y1="193" x2="572" y2="217" stroke="#CA8A04" stroke-width="2"/>
  <line x1="572" y1="193" x2="548" y2="217" stroke="#CA8A04" stroke-width="2"/>
  <!-- Ammeter (bottom) -->
  <circle cx="320" cy="295" r="22" fill="white" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="320" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#1D4ED8">A</text>
  <!-- Formula -->
  <rect x="200" y="330" width="240" height="44" rx="10" fill="white" fill-opacity="0.9" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="320" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">V = I × R</text>
  <text x="320" y="366" text-anchor="middle" font-size="11" fill="#3B82F6">I = 0.12 A   P = 1.44 W</text>
  <!-- Title -->
  <text x="320" y="52" text-anchor="middle" font-size="20" font-weight="800" fill="#1E3A8A">Ohm's Law &amp; DC Circuit</text>
  <text x="320" y="76" text-anchor="middle" font-size="12" fill="#3B82F6">Voltage · Current · Resistance</text>
</svg>