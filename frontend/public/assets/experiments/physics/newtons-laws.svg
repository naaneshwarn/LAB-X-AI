<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <marker id="fa" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="fb" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#EF4444"/>
    </marker>
    <marker id="fn" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22C55E"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#14532D">Newton's Laws of Motion</text>
  <!-- Ground -->
  <rect x="0" y="300" width="640" height="6" fill="#6EE7B7"/>
  <!-- Block on ground -->
  <rect x="230" y="250" width="100" height="50" rx="6" fill="#2563EB"/>
  <text x="280" y="280" text-anchor="middle" font-size="13" font-weight="800" fill="white">m=5kg</text>
  <!-- Applied Force -->
  <line x1="140" y1="275" x2="225" y2="275" stroke="#2563EB" stroke-width="4" marker-end="url(#fa)"/>
  <text x="140" y="260" font-size="12" font-weight="700" fill="#1D4ED8">F = 20 N →</text>
  <!-- Friction force -->
  <line x1="340" y1="275" x2="420" y2="275" stroke="#EF4444" stroke-width="4" marker-end="url(#fb)"/>
  <text x="430" y="260" font-size="12" font-weight="700" fill="#B91C1C">← f friction</text>
  <!-- Normal force -->
  <line x1="280" y1="250" x2="280" y2="175" stroke="#22C55E" stroke-width="4" marker-end="url(#fn)"/>
  <text x="287" y="170" font-size="12" font-weight="700" fill="#15803D">N (normal)</text>
  <!-- Weight force -->
  <line x1="280" y1="300" x2="280" y2="355" stroke="#F59E0B" stroke-width="4"/>
  <polygon points="272,350 280,368 288,350" fill="#F59E0B"/>
  <text x="287" y="368" font-size="12" font-weight="700" fill="#D97706">W = mg</text>
  <!-- 3 Laws boxes -->
  <rect x="30" y="60" width="180" height="80" rx="10" fill="white" fill-opacity="0.9" stroke="#86EFAC" stroke-width="2"/>
  <text x="120" y="84" text-anchor="middle" font-size="12" font-weight="800" fill="#14532D">1st Law: Inertia</text>
  <text x="120" y="102" text-anchor="middle" font-size="10" fill="#166534">An object at rest stays</text>
  <text x="120" y="117" text-anchor="middle" font-size="10" fill="#166534">at rest unless acted on</text>
  <text x="120" y="132" text-anchor="middle" font-size="10" fill="#166534">by an external force</text>

  <rect x="230" y="60" width="180" height="80" rx="10" fill="white" fill-opacity="0.9" stroke="#86EFAC" stroke-width="2"/>
  <text x="320" y="84" text-anchor="middle" font-size="12" font-weight="800" fill="#14532D">2nd Law: F = ma</text>
  <text x="320" y="102" text-anchor="middle" font-size="10" fill="#166534">Net force equals mass</text>
  <text x="320" y="117" text-anchor="middle" font-size="10" fill="#166534">times acceleration</text>
  <text x="320" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">a = F/m = 4 m/s²</text>

  <rect x="430" y="60" width="180" height="80" rx="10" fill="white" fill-opacity="0.9" stroke="#86EFAC" stroke-width="2"/>
  <text x="520" y="84" text-anchor="middle" font-size="12" font-weight="800" fill="#14532D">3rd Law: Action-Reaction</text>
  <text x="520" y="102" text-anchor="middle" font-size="10" fill="#166534">Every action has an</text>
  <text x="520" y="117" text-anchor="middle" font-size="10" fill="#166534">equal and opposite</text>
  <text x="520" y="132" text-anchor="middle" font-size="10" fill="#166534">reaction force</text>
</svg>