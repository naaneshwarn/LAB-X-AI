<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="100%" stop-color="#FEF9C3"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#854D0E">Photoelectric Effect</text>
  <!-- Metal plate -->
  <rect x="240" y="140" width="180" height="180" rx="8" fill="#94A3B8"/>
  <text x="330" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="white">Metal Plate</text>
  <text x="330" y="268" text-anchor="middle" font-size="11" fill="#E2E8F0">Zinc (φ = 4.3 eV)</text>
  <!-- UV Photons hitting plate -->
  <circle cx="80" cy="90" r="18" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
  <text x="80" y="95" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">UV</text>
  <!-- Photon rays -->
  <line x1="98" y1="98" x2="230" y2="165" stroke="#FBBF24" stroke-width="3.5"/>
  <polygon points="226,157 240,170 220,170" fill="#FBBF24"/>
  <line x1="100" y1="90" x2="230" y2="190" stroke="#FBBF24" stroke-width="2.5"/>
  <polygon points="225,183 238,196 220,195" fill="#FBBF24"/>
  <line x1="100" y1="82" x2="230" y2="215" stroke="#FBBF24" stroke-width="2"/>
  <!-- Electrons ejected -->
  <circle cx="430" cy="120" r="10" fill="#60A5FA" stroke="#2563EB" stroke-width="2"/>
  <text x="430" y="124" text-anchor="middle" font-size="9" fill="white">e⁻</text>
  <line x1="420" y1="120" x2="380" y2="150" stroke="#2563EB" stroke-width="2"/>
  <polygon points="382,142 375,153 390,152" fill="#2563EB"/>
  <circle cx="490" cy="90" r="10" fill="#60A5FA" stroke="#2563EB" stroke-width="2"/>
  <text x="490" y="94" text-anchor="middle" font-size="9" fill="white">e⁻</text>
  <line x1="480" y1="90" x2="420" y2="140" stroke="#2563EB" stroke-width="2"/>
  <circle cx="380" cy="80" r="10" fill="#60A5FA" stroke="#2563EB" stroke-width="2"/>
  <text x="380" y="84" text-anchor="middle" font-size="9" fill="white">e⁻</text>
  <line x1="372" y1="84" x2="340" y2="142" stroke="#2563EB" stroke-width="2"/>
  <!-- Graph: K max vs frequency -->
  <rect x="480" y="150" width="140" height="120" rx="8" fill="white" fill-opacity="0.9" stroke="#FDE68A" stroke-width="1.5"/>
  <line x1="496" y1="258" x2="604" y2="258" stroke="#374151" stroke-width="1.5"/>
  <line x1="496" y1="258" x2="496" y2="162" stroke="#374151" stroke-width="1.5"/>
  <path d="M516,258 L548,230 L580,202 L604,180" fill="none" stroke="#EF4444" stroke-width="2.5"/>
  <text x="556" y="276" text-anchor="middle" font-size="9" fill="#374151">ν (freq)</text>
  <text x="484" y="210" font-size="9" fill="#374151" transform="rotate(-90,484,210)">K_max</text>
  <text x="556" y="162" text-anchor="middle" font-size="10" font-weight="700" fill="#B91C1C">Einstein's Plot</text>
  <!-- Formula -->
  <rect x="80" y="330" width="340" height="52" rx="10" fill="white" fill-opacity="0.9" stroke="#FEF08A" stroke-width="1.5"/>
  <text x="250" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#854D0E">K_max = hν − φ (Work Function)</text>
  <text x="250" y="372" text-anchor="middle" font-size="11" fill="#A16207">h = 6.626 × 10⁻³⁴ J·s</text>
</svg>