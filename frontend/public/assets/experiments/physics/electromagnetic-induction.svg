<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#9F1239">Electromagnetic Induction</text>
  <!-- Coil (solenoid) -->
  <rect x="180" y="130" width="260" height="140" rx="8" fill="#FFF5F5" stroke="#BE123C" stroke-width="2.5"/>
  <text x="310" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#9F1239">Solenoid Coil</text>
  <!-- Coil windings -->
  <ellipse cx="180" cy="145" rx="12" ry="20" fill="none" stroke="#BE123C" stroke-width="2.5"/>
  <ellipse cx="210" cy="145" rx="12" ry="20" fill="none" stroke="#BE123C" stroke-width="2.5"/>
  <ellipse cx="240" cy="145" rx="12" ry="20" fill="none" stroke="#BE123C" stroke-width="2.5"/>
  <ellipse cx="270" cy="145" rx="12" ry="20" fill="none" stroke="#BE123C" stroke-width="2.5"/>
  <ellipse cx="300" cy="145" rx="12" ry="20" fill="none" stroke="#BE123C" stroke-width="2.5"/>
  <ellipse cx="330" cy="145" rx="12" ry="20" fill="none" stroke="#BE123C" stroke-width="2.5"/>
  <ellipse cx="360" cy="145" rx="12" ry="20" fill="none" stroke="#BE123C" stroke-width="2.5"/>
  <ellipse cx="390" cy="145" rx="12" ry="20" fill="none" stroke="#BE123C" stroke-width="2.5"/>
  <ellipse cx="420" cy="145" rx="12" ry="20" fill="none" stroke="#BE123C" stroke-width="2.5"/>
  <!-- Magnet (bar) moving in -->
  <rect x="60" y="165" width="140" height="70" rx="8" fill="#EF4444"/>
  <rect x="60" y="165" width="70" height="70" rx="8" fill="#1D4ED8"/>
  <text x="95" y="206" text-anchor="middle" font-size="18" font-weight="800" fill="white">N</text>
  <text x="165" y="206" text-anchor="middle" font-size="18" font-weight="800" fill="white">S</text>
  <!-- Motion arrow -->
  <line x1="195" y1="200" x2="230" y2="200" stroke="#374151" stroke-width="3"/>
  <polygon points="225,193 240,200 225,207" fill="#374151"/>
  <text x="140" y="250" font-size="11" font-weight="700" fill="#374151">Moving magnet →</text>
  <!-- Galvanometer -->
  <circle cx="540" cy="200" r="40" fill="white" stroke="#7C3AED" stroke-width="3"/>
  <text x="540" y="196" text-anchor="middle" font-size="12" font-weight="800" fill="#6D28D9">G</text>
  <text x="540" y="212" text-anchor="middle" font-size="10" fill="#7C3AED">EMF!</text>
  <!-- Wires from coil to galvano -->
  <line x1="440" y1="170" x2="510" y2="170" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="510" y1="170" x2="510" y2="200" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="510" y1="200" x2="503" y2="200" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="440" y1="260" x2="510" y2="260" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="510" y1="260" x2="510" y2="230" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="510" y1="230" x2="503" y2="210" stroke="#7C3AED" stroke-width="2.5"/>
  <!-- Faraday law -->
  <rect x="160" y="310" width="310" height="58" rx="10" fill="white" fill-opacity="0.9" stroke="#FECDD3" stroke-width="1.5"/>
  <text x="315" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#9F1239">Faraday's Law of Induction</text>
  <text x="315" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#BE123C">ε = −N·dΦ/dt</text>
</svg>