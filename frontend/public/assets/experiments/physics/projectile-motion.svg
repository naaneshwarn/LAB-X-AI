<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="80%" stop-color="#F0F9FF"/>
    </linearGradient>
    <marker id="va" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="vb" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#EF4444"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="url(#sky)" rx="12"/>
  <!-- Ground -->
  <rect x="0" y="340" width="640" height="60" fill="#86EFAC"/>
  <rect x="0" y="336" width="640" height="8" fill="#22C55E"/>
  <!-- Trajectory parabola -->
  <path d="M80,330 Q360,30 580,330" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-dasharray="8,4"/>
  <!-- Launch cannon -->
  <rect x="40" y="300" width="60" height="40" rx="6" fill="#475569"/>
  <rect x="80" y="310" width="50" height="20" rx="4" fill="#334155" transform="rotate(-35,80,320)"/>
  <!-- Ball at peak -->
  <circle cx="330" cy="88" r="18" fill="#FB923C" stroke="#EA580C" stroke-width="2.5"/>
  <!-- Ball at mid -->
  <circle cx="200" cy="195" r="13" fill="#FCD34D" stroke="#D97706" stroke-width="2" fill-opacity="0.8"/>
  <circle cx="460" cy="195" r="13" fill="#FCD34D" stroke="#D97706" stroke-width="2" fill-opacity="0.8"/>
  <!-- Velocity vectors at peak -->
  <line x1="330" y1="88" x2="390" y2="88" stroke="#2563EB" stroke-width="3" marker-end="url(#va)"/>
  <text x="395" y="84" font-size="11" font-weight="700" fill="#2563EB">vₓ</text>
  <!-- Height marker -->
  <line x1="560" y1="88" x2="560" y2="336" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="572" y="215" font-size="12" font-weight="700" fill="#64748B">H</text>
  <!-- Range marker -->
  <line x1="80" y1="355" x2="580" y2="355" stroke="#16A34A" stroke-width="2"/>
  <text x="330" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">Range R</text>
  <!-- Formula -->
  <rect x="380" y="60" width="230" height="70" rx="10" fill="white" fill-opacity="0.92" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="495" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Projectile Motion</text>
  <text x="495" y="102" text-anchor="middle" font-size="12" fill="#2563EB">R = v₀² sin(2θ) / g</text>
  <text x="495" y="120" text-anchor="middle" font-size="12" fill="#2563EB">H = v₀² sin²θ / 2g</text>
  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="800" fill="#1E3A8A">2D Projectile Motion</text>
</svg>