<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <marker id="ra" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2563EB"/>
    </marker>
    <marker id="rb" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#EF4444"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <!-- Principal axis -->
  <line x1="30" y1="200" x2="610" y2="200" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Convex lens -->
  <path d="M310,80 Q350,200 310,320 Q270,200 310,80" fill="#BFDBFE" fill-opacity="0.6" stroke="#2563EB" stroke-width="3"/>
  <!-- Object arrow (left) -->
  <line x1="140" y1="200" x2="140" y2="120" stroke="#059669" stroke-width="3"/>
  <polygon points="130,120 140,100 150,120" fill="#059669"/>
  <text x="125" y="225" font-size="11" font-weight="700" fill="#065F46">Object</text>
  <!-- Ray 1: parallel to axis → through F' -->
  <line x1="140" y1="120" x2="310" y2="120" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ra)"/>
  <line x1="310" y1="120" x2="490" y2="310" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ra)"/>
  <!-- Ray 2: through center -->
  <line x1="140" y1="120" x2="490" y2="310" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#rb)"/>
  <!-- Ray 3: through F → parallel after lens -->
  <line x1="140" y1="120" x2="310" y2="168" stroke="#F59E0B" stroke-width="2.5"/>
  <line x1="310" y1="168" x2="490" y2="168" stroke="#F59E0B" stroke-width="2.5"/>
  <!-- Image arrow (right) -->
  <line x1="490" y1="200" x2="490" y2="310" stroke="#7C3AED" stroke-width="3"/>
  <polygon points="480,310 490,330 500,310" fill="#7C3AED"/>
  <text x="470" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#6D28D9">Image</text>
  <!-- Focal points -->
  <circle cx="220" cy="200" r="5" fill="#EF4444"/>
  <text x="220" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#B91C1C">F</text>
  <circle cx="400" cy="200" r="5" fill="#EF4444"/>
  <text x="400" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#B91C1C">F'</text>
  <!-- Formula -->
  <rect x="20" y="315" width="210" height="58" rx="10" fill="white" fill-opacity="0.92" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="125" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#4C1D95">Thin Lens Formula</text>
  <text x="125" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#6D28D9">1/v − 1/u = 1/f</text>
  <!-- Title -->
  <text x="320" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#4C1D95">Convex Lens &amp; Ray Diagrams</text>
</svg>