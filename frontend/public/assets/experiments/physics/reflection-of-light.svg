<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <!-- Mirror -->
  <rect x="295" y="80" width="18" height="250" rx="4" fill="#94A3B8"/>
  <rect x="308" y="80" width="6" height="250" rx="2" fill="#64748B"/>
  <!-- Hatching on mirror back -->
  <line x1="313" y1="90" x2="325" y2="100" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="313" y1="110" x2="325" y2="120" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="313" y1="130" x2="325" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="313" y1="150" x2="325" y2="160" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="313" y1="170" x2="325" y2="180" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="313" y1="190" x2="325" y2="200" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="313" y1="210" x2="325" y2="220" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="313" y1="230" x2="325" y2="240" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="313" y1="250" x2="325" y2="260" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="313" y1="270" x2="325" y2="280" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="313" y1="290" x2="325" y2="300" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Normal (dashed vertical) -->
  <line x1="304" y1="60" x2="304" y2="350" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Incident ray -->
  <line x1="100" y1="100" x2="304" y2="210" stroke="#FBBF24" stroke-width="3.5" marker-end="url(#ya)"/>
  <defs>
    <marker id="ya" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#FBBF24"/>
    </marker>
    <marker id="yb" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#34D399"/>
    </marker>
  </defs>
  <!-- Reflected ray -->
  <line x1="304" y1="210" x2="100" y2="330" stroke="#34D399" stroke-width="3.5" marker-end="url(#yb)"/>
  <!-- Angle arcs -->
  <path d="M270,210 A35,35 0 0,1 304,175" fill="none" stroke="#FBBF24" stroke-width="2"/>
  <text x="258" y="192" font-size="12" font-weight="700" fill="#D97706">θᵢ</text>
  <path d="M270,210 A35,35 0 0,0 304,245" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="258" y="250" font-size="12" font-weight="700" fill="#059669">θᵣ</text>
  <!-- Labels -->
  <text x="140" y="95" font-size="13" font-weight="700" fill="#D97706">Incident Ray</text>
  <text x="110" y="348" font-size="13" font-weight="700" fill="#059669">Reflected Ray</text>
  <!-- Law -->
  <rect x="380" y="160" width="230" height="60" rx="10" fill="white" fill-opacity="0.92" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="495" y="185" text-anchor="middle" font-size="14" font-weight="800" fill="#1E3A8A">Law of Reflection</text>
  <text x="495" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">θᵢ = θᵣ</text>
  <!-- Title -->
  <text x="320" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#1E3A8A">Reflection of Light</text>
</svg>