<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#1E3A8A">Number Systems &amp; Binary</text>
  <!-- Binary representation of 42 -->
  <rect x="40" y="52" width="560" height="100" rx="12" fill="white" fill-opacity="0.9" stroke="#93C5FD" stroke-width="2"/>
  <text x="320" y="76" text-anchor="middle" font-size="13" font-weight="800" fill="#1E3A8A">Decimal 42 in Different Bases</text>
  <text x="320" y="102" text-anchor="middle" font-size="20" font-weight="800" fill="#2563EB">42₁₀ = 101010₂ = 2A₁₆ = 52₈</text>
  <text x="320" y="124" text-anchor="middle" font-size="12" fill="#374151">Decimal  |  Binary  |  Hexadecimal  |  Octal</text>
  <!-- Binary place value diagram -->
  <rect x="40" y="168" width="560" height="130" rx="12" fill="white" fill-opacity="0.9" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="320" y="192" text-anchor="middle" font-size="12" font-weight="800" fill="#1E3A8A">Binary Place Values: 42 = 32 + 8 + 2</text>
  <!-- Place value boxes -->
  <rect x="58" y="206" width="66" height="58" rx="6" fill="#2563EB"/>
  <text x="91" y="232" text-anchor="middle" font-size="13" font-weight="800" fill="white">1</text>
  <text x="91" y="250" text-anchor="middle" font-size="10" fill="#BAE6FD">2⁵=32</text>
  <rect x="136" y="206" width="66" height="58" rx="6" fill="#93C5FD"/>
  <text x="169" y="232" text-anchor="middle" font-size="13" font-weight="800" fill="#1E3A8A">0</text>
  <text x="169" y="250" text-anchor="middle" font-size="10" fill="#374151">2⁴=16</text>
  <rect x="214" y="206" width="66" height="58" rx="6" fill="#2563EB"/>
  <text x="247" y="232" text-anchor="middle" font-size="13" font-weight="800" fill="white">1</text>
  <text x="247" y="250" text-anchor="middle" font-size="10" fill="#BAE6FD">2³=8</text>
  <rect x="292" y="206" width="66" height="58" rx="6" fill="#93C5FD"/>
  <text x="325" y="232" text-anchor="middle" font-size="13" font-weight="800" fill="#1E3A8A">0</text>
  <text x="325" y="250" text-anchor="middle" font-size="10" fill="#374151">2²=4</text>
  <rect x="370" y="206" width="66" height="58" rx="6" fill="#2563EB"/>
  <text x="403" y="232" text-anchor="middle" font-size="13" font-weight="800" fill="white">1</text>
  <text x="403" y="250" text-anchor="middle" font-size="10" fill="#BAE6FD">2¹=2</text>
  <rect x="448" y="206" width="66" height="58" rx="6" fill="#93C5FD"/>
  <text x="481" y="232" text-anchor="middle" font-size="13" font-weight="800" fill="#1E3A8A">0</text>
  <text x="481" y="250" text-anchor="middle" font-size="10" fill="#374151">2⁰=1</text>
  <!-- Sum -->
  <text x="320" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">32 + 0 + 8 + 0 + 2 + 0 = 42</text>
  <!-- Number sets diagram -->
  <rect x="40" y="315" width="560" height="70" rx="12" fill="white" fill-opacity="0.88" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="320" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Number Sets: ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ</text>
  <text x="320" y="358" text-anchor="middle" font-size="11" fill="#374151">Natural ⊂ Integers ⊂ Rational ⊂ Real ⊂ Complex</text>
  <text x="320" y="376" text-anchor="middle" font-size="11" fill="#374151">Primes: 2, 3, 5, 7, 11, 13, 17, 19, 23…</text>
</svg>