<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#14532D">Algebraic Expressions &amp; Identities</text>
  <!-- Algebra tiles (left) -->
  <rect x="20" y="52" width="260" height="310" rx="12" fill="white" fill-opacity="0.9" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="150" y="76" text-anchor="middle" font-size="12" font-weight="800" fill="#14532D">Algebra Tiles</text>
  <!-- x² tile -->
  <rect x="38" y="90" width="80" height="80" rx="4" fill="#34D399" fill-opacity="0.8"/>
  <text x="78" y="135" text-anchor="middle" font-size="20" font-weight="800" fill="white">x²</text>
  <!-- x tiles -->
  <rect x="128" y="90" width="30" height="80" rx="4" fill="#34D399" fill-opacity="0.5"/>
  <text x="143" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">x</text>
  <rect x="162" y="90" width="30" height="80" rx="4" fill="#34D399" fill-opacity="0.5"/>
  <text x="177" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">x</text>
  <!-- unit tiles -->
  <rect x="38" y="178" width="30" height="30" rx="4" fill="#86EFAC"/>
  <rect x="72" y="178" width="30" height="30" rx="4" fill="#86EFAC"/>
  <rect x="106" y="178" width="30" height="30" rx="4" fill="#86EFAC"/>
  <text x="150" y="200" font-size="12" fill="#059669">+1 +1 +1</text>
  <text x="150" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#14532D">= x² + 2x + 3</text>
  <!-- FOIL expansion -->
  <text x="150" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">FOIL: (x+a)(x+b)</text>
  <text x="150" y="282" text-anchor="middle" font-size="11" fill="#374151">= x² + bx + ax + ab</text>
  <text x="150" y="302" text-anchor="middle" font-size="11" fill="#374151">= x² + (a+b)x + ab</text>
  <text x="150" y="338" text-anchor="middle" font-size="12" font-weight="800" fill="#059669">(x+3)² = x²+6x+9</text>
  <!-- Parabola graph (right) -->
  <rect x="300" y="52" width="320" height="310" rx="12" fill="white" fill-opacity="0.9" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="460" y="76" text-anchor="middle" font-size="12" font-weight="800" fill="#14532D">y = x² − 4x + 3</text>
  <!-- Axes -->
  <line x1="318" y1="300" x2="602" y2="300" stroke="#374151" stroke-width="1.5"/>
  <line x1="460" y1="88" x2="460" y2="304" stroke="#374151" stroke-width="1.5"/>
  <!-- Parabola -->
  <path d="M330,290 Q370,170 420,110 Q460,80 500,110 Q540,170 580,290" fill="none" stroke="#22C55E" stroke-width="3"/>
  <!-- Roots on x-axis -->
  <circle cx="372" cy="300" r="6" fill="#EF4444"/>
  <text x="372" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#B91C1C">x=1</text>
  <circle cx="548" cy="300" r="6" fill="#EF4444"/>
  <text x="548" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#B91C1C">x=3</text>
  <!-- Vertex -->
  <circle cx="460" cy="94" r="6" fill="#2563EB"/>
  <text x="460" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#1D4ED8">vertex (2,−1)</text>
  <!-- Axis of symmetry -->
  <line x1="460" y1="88" x2="460" y2="304" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="466" y="140" font-size="9" fill="#6D28D9">x=2</text>
  <!-- Formula at bottom -->
  <text x="460" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">Roots: x = (4 ± √4) / 2 = 1, 3</text>
</svg>