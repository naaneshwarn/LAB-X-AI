<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#4C1D95">Basic Geometry: Triangles &amp; Circles</text>
  <!-- Right triangle (left) -->
  <polygon points="80,320 80,120 280,320" fill="#DBEAFE" fill-opacity="0.8" stroke="#2563EB" stroke-width="3"/>
  <!-- Right angle box -->
  <rect x="80" y="300" width="20" height="20" fill="none" stroke="#2563EB" stroke-width="2"/>
  <!-- Labels -->
  <text x="68" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">a</text>
  <text x="183" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">b</text>
  <text x="196" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8" transform="rotate(-57,196,218)">c</text>
  <!-- Angle theta -->
  <path d="M280,320 A40,40 0 0,0 240,286" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="258" y="310" font-size="12" font-weight="700" fill="#D97706">θ</text>
  <!-- Pythagoras -->
  <rect x="38" y="336" width="232" height="50" rx="8" fill="white" fill-opacity="0.9" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="154" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#4C1D95">a² + b² = c²</text>
  <text x="154" y="376" text-anchor="middle" font-size="12" fill="#2563EB">sin θ = a/c   cos θ = b/c</text>
  <!-- Circle with parts (right) -->
  <circle cx="470" cy="195" r="120" fill="#A78BFA" fill-opacity="0.2" stroke="#7C3AED" stroke-width="3"/>
  <!-- Center -->
  <circle cx="470" cy="195" r="5" fill="#7C3AED"/>
  <!-- Radius -->
  <line x1="470" y1="195" x2="560" y2="140" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="522" y="158" font-size="12" font-weight="700" fill="#6D28D9">r</text>
  <!-- Diameter -->
  <line x1="350" y1="195" x2="590" y2="195" stroke="#2563EB" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="596" y="200" font-size="12" font-weight="700" fill="#1D4ED8">d=2r</text>
  <!-- Chord -->
  <line x1="380" y1="130" x2="540" y2="135" stroke="#34D399" stroke-width="2.5"/>
  <text x="460" y="124" font-size="11" font-weight="700" fill="#059669">Chord</text>
  <!-- Arc label -->
  <path d="M350,195 A120,120 0 0,1 380,130" fill="none" stroke="#FB923C" stroke-width="2.5"/>
  <text x="348" y="156" font-size="11" font-weight="700" fill="#EA580C">Arc</text>
  <!-- Sector shading -->
  <path d="M470,195 L590,195 A120,120 0 0,0 560,140 Z" fill="#A78BFA" fill-opacity="0.4"/>
  <text x="535" y="195" font-size="10" fill="#6D28D9">Sector</text>
  <!-- Formulas -->
  <rect x="348" y="332" width="262" height="56" rx="8" fill="white" fill-opacity="0.9" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="479" y="353" text-anchor="middle" font-size="12" font-weight="700" fill="#4C1D95">Area = πr²    C = 2πr</text>
  <text x="479" y="373" text-anchor="middle" font-size="12" fill="#6D28D9">Triangle Area = ½ × base × height</text>
</svg>