<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#C2410C">Trigonometric Functions &amp; Unit Circle</text>
  <!-- Unit circle (left) -->
  <circle cx="175" cy="220" r="130" fill="#FFF7ED" stroke="#D97706" stroke-width="2.5"/>
  <line x1="45" y1="220" x2="305" y2="220" stroke="#374151" stroke-width="1.5"/>
  <line x1="175" y1="90" x2="175" y2="350" stroke="#374151" stroke-width="1.5"/>
  <!-- Point on circle at ~60° -->
  <circle cx="240" cy="150" r="8" fill="#EF4444"/>
  <line x1="175" y1="220" x2="240" y2="150" stroke="#2563EB" stroke-width="3"/>
  <text x="206" y="183" font-size="12" font-weight="700" fill="#1D4ED8">r=1</text>
  <!-- sin drop -->
  <line x1="240" y1="150" x2="240" y2="220" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="252" y="192" font-size="11" font-weight="700" fill="#B91C1C">sin θ</text>
  <!-- cos drop -->
  <line x1="175" y1="220" x2="240" y2="220" stroke="#22C55E" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="206" y="236" font-size="11" font-weight="700" fill="#15803D">cos θ</text>
  <!-- Angle arc -->
  <path d="M205,220 A32,32 0 0,0 190,197" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="210" y="210" font-size="12" font-weight="700" fill="#D97706">θ=60°</text>
  <!-- SOHCAHTOA label -->
  <text x="175" y="380" text-anchor="middle" font-size="12" font-weight="800" fill="#C2410C">sin=O/H  cos=A/H  tan=O/A</text>
  <!-- Sine wave (right) -->
  <rect x="320" y="52" width="300" height="175" rx="12" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="470" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">Sine and Cosine Waves</text>
  <!-- x axis -->
  <line x1="336" y1="150" x2="604" y2="150" stroke="#374151" stroke-width="1.5"/>
  <!-- y axis -->
  <line x1="336" y1="88" x2="336" y2="216" stroke="#374151" stroke-width="1.5"/>
  <!-- Sine wave (blue) -->
  <path d="M340,150 Q374,88 408,150 Q442,212 476,150 Q510,88 544,150 Q578,212 603,150" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <!-- Cosine wave (red, offset) -->
  <path d="M340,88 Q374,150 408,88 Q442,26 476,88 Q510,150 544,88 Q578,26 603,88" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="416" y="92" font-size="10" fill="#2563EB">sin(x)</text>
  <text x="416" y="82" font-size="10" fill="#EF4444">cos(x)</text>
  <!-- Period marker -->
  <line x1="340" y1="216" x2="476" y2="216" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="408" y="226" text-anchor="middle" font-size="10" fill="#374151">Period = 2π</text>
  <!-- Special values table -->
  <rect x="320" y="246" width="300" height="140" rx="12" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="470" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">Special Angle Values</text>
  <text x="400" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">θ</text>
  <text x="470" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">sin θ</text>
  <text x="560" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">cos θ</text>
  <text x="400" y="310" text-anchor="middle" font-size="11" fill="#374151">0°</text>
  <text x="470" y="310" text-anchor="middle" font-size="11" fill="#374151">0</text>
  <text x="560" y="310" text-anchor="middle" font-size="11" fill="#374151">1</text>
  <text x="400" y="330" text-anchor="middle" font-size="11" fill="#374151">30°</text>
  <text x="470" y="330" text-anchor="middle" font-size="11" fill="#374151">1/2</text>
  <text x="560" y="330" text-anchor="middle" font-size="11" fill="#374151">√3/2</text>
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#374151">45°</text>
  <text x="470" y="350" text-anchor="middle" font-size="11" fill="#374151">1/√2</text>
  <text x="560" y="350" text-anchor="middle" font-size="11" fill="#374151">1/√2</text>
  <text x="400" y="370" text-anchor="middle" font-size="11" fill="#374151">90°</text>
  <text x="470" y="370" text-anchor="middle" font-size="11" fill="#374151">1</text>
  <text x="560" y="370" text-anchor="middle" font-size="11" fill="#374151">0</text>
</svg>