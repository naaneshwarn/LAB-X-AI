<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#1E3A8A">Coordinate Geometry</text>
  <!-- Grid -->
  <g stroke="#E2E8F0" stroke-width="1" opacity="0.8">
    <line x1="80" y1="52" x2="80" y2="380"/>
    <line x1="150" y1="52" x2="150" y2="380"/>
    <line x1="220" y1="52" x2="220" y2="380"/>
    <line x1="290" y1="52" x2="290" y2="380"/>
    <line x1="360" y1="52" x2="360" y2="380"/>
    <line x1="430" y1="52" x2="430" y2="380"/>
    <line x1="500" y1="52" x2="500" y2="380"/>
    <line x1="570" y1="52" x2="570" y2="380"/>
    <line x1="40" y1="92" x2="620" y2="92"/>
    <line x1="40" y1="162" x2="620" y2="162"/>
    <line x1="40" y1="232" x2="620" y2="232"/>
    <line x1="40" y1="302" x2="620" y2="302"/>
    <line x1="40" y1="372" x2="620" y2="372"/>
  </g>
  <!-- Axes -->
  <line x1="40" y1="232" x2="620" y2="232" stroke="#374151" stroke-width="2.5"/>
  <line x1="290" y1="52" x2="290" y2="380" stroke="#374151" stroke-width="2.5"/>
  <text x="616" y="228" font-size="13" font-weight="700" fill="#374151">x</text>
  <text x="286" y="50" font-size="13" font-weight="700" fill="#374151">y</text>
  <!-- Origin -->
  <text x="276" y="246" font-size="11" fill="#374151">O</text>
  <!-- Axis labels -->
  <text x="362" y="248" font-size="10" fill="#374151">1</text>
  <text x="432" y="248" font-size="10" fill="#374151">2</text>
  <text x="502" y="248" font-size="10" fill="#374151">3</text>
  <text x="216" y="248" font-size="10" fill="#374151">-1</text>
  <text x="146" y="248" font-size="10" fill="#374151">-2</text>
  <text x="296" y="168" font-size="10" fill="#374151">2</text>
  <text x="296" y="98" font-size="10" fill="#374151">4</text>
  <text x="296" y="308" font-size="10" fill="#374151">-2</text>
  <!-- Line y = 2x + 1 -->
  <line x1="80" y1="372" x2="570" y2="92" stroke="#2563EB" stroke-width="3"/>
  <text x="430" y="118" font-size="13" font-weight="700" fill="#1D4ED8">y = 2x + 1</text>
  <!-- Points on line -->
  <circle cx="290" cy="162" r="8" fill="#EF4444" stroke="white" stroke-width="2"/>
  <text x="302" y="156" font-size="11" font-weight="700" fill="#B91C1C">(0, 1)</text>
  <circle cx="395" cy="92" r="8" fill="#22C55E" stroke="white" stroke-width="2"/>
  <text x="406" y="88" font-size="11" font-weight="700" fill="#15803D">(1.5, 4)</text>
  <circle cx="150" cy="302" r="8" fill="#FB923C" stroke="white" stroke-width="2"/>
  <text x="100" y="318" font-size="11" font-weight="700" fill="#EA580C">(-2, -3)</text>
  <!-- Slope indicator -->
  <line x1="290" y1="162" x2="360" y2="162" stroke="#A78BFA" stroke-width="2"/>
  <line x1="360" y1="162" x2="360" y2="92" stroke="#A78BFA" stroke-width="2"/>
  <text x="324" y="176" font-size="10" fill="#6D28D9">run=1</text>
  <text x="365" y="130" font-size="10" fill="#6D28D9">rise=2</text>
  <!-- Formula box -->
  <rect x="80" y="348" width="440" height="40" rx="8" fill="white" fill-opacity="0.9" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="300" y="366" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">y = mx + c   |   slope m = Δy/Δx = 2   |   Distance = √[(x₂−x₁)² + (y₂−y₁)²]</text>
</svg>