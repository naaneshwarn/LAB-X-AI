<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#4C1D95">Probability &amp; Statistics</text>
  <!-- Dice (left) -->
  <rect x="30" y="52" width="84" height="84" rx="10" fill="white" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="52" cy="74" r="8" fill="#7C3AED"/>
  <circle cx="96" cy="74" r="8" fill="#7C3AED"/>
  <circle cx="52" cy="118" r="8" fill="#7C3AED"/>
  <circle cx="96" cy="118" r="8" fill="#7C3AED"/>
  <circle cx="52" cy="96" r="8" fill="#7C3AED"/>
  <circle cx="96" cy="96" r="8" fill="#7C3AED"/>
  <text x="73" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#6D28D9">Die (1-6)</text>
  <!-- Coin (next to dice) -->
  <circle cx="162" cy="94" r="40" fill="#FBBF24" stroke="#D97706" stroke-width="3"/>
  <text x="162" y="90" text-anchor="middle" font-size="12" font-weight="800" fill="#92400E">HEADS</text>
  <text x="162" y="108" text-anchor="middle" font-size="10" fill="#A16207">P = 0.5</text>
  <text x="162" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#D97706">Coin Flip</text>
  <!-- Binomial distribution bar chart -->
  <rect x="250" y="52" width="370" height="230" rx="12" fill="white" fill-opacity="0.9" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="435" y="76" text-anchor="middle" font-size="12" font-weight="800" fill="#4C1D95">Binomial Distribution P(X=k) n=6, p=0.5</text>
  <!-- Bars -->
  <line x1="268" y1="262" x2="602" y2="262" stroke="#374151" stroke-width="1.5"/>
  <line x1="268" y1="88" x2="268" y2="266" stroke="#374151" stroke-width="1.5"/>
  <!-- k=0 -->
  <rect x="275" y="254" width="38" height="8" rx="3" fill="#A78BFA"/>
  <text x="294" y="276" text-anchor="middle" font-size="10" fill="#374151">0</text>
  <!-- k=1 -->
  <rect x="318" y="234" width="38" height="28" rx="3" fill="#A78BFA"/>
  <text x="337" y="276" text-anchor="middle" font-size="10" fill="#374151">1</text>
  <!-- k=2 -->
  <rect x="361" y="195" width="38" height="67" rx="3" fill="#7C3AED"/>
  <text x="380" y="276" text-anchor="middle" font-size="10" fill="#374151">2</text>
  <!-- k=3 -->
  <rect x="404" y="176" width="38" height="86" rx="3" fill="#6D28D9"/>
  <text x="423" y="276" text-anchor="middle" font-size="10" fill="#374151">3</text>
  <!-- k=4 -->
  <rect x="447" y="195" width="38" height="67" rx="3" fill="#7C3AED"/>
  <text x="466" y="276" text-anchor="middle" font-size="10" fill="#374151">4</text>
  <!-- k=5 -->
  <rect x="490" y="234" width="38" height="28" rx="3" fill="#A78BFA"/>
  <text x="509" y="276" text-anchor="middle" font-size="10" fill="#374151">5</text>
  <!-- k=6 -->
  <rect x="533" y="254" width="38" height="8" rx="3" fill="#A78BFA"/>
  <text x="552" y="276" text-anchor="middle" font-size="10" fill="#374151">6</text>
  <text x="435" y="262" text-anchor="middle" font-size="10" fill="#374151">k (successes) →</text>
  <!-- Probability rules -->
  <rect x="20" y="290" width="600" height="96" rx="12" fill="white" fill-opacity="0.88" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="320" y="312" text-anchor="middle" font-size="13" font-weight="800" fill="#4C1D95">Key Probability Rules</text>
  <text x="175" y="336" text-anchor="middle" font-size="11" fill="#374151">P(A ∪ B) = P(A)+P(B)−P(A∩B)</text>
  <text x="470" y="336" text-anchor="middle" font-size="11" fill="#374151">P(A|B) = P(A∩B) / P(B)  Bayes'</text>
  <text x="175" y="358" text-anchor="middle" font-size="11" fill="#374151">P(A∩B) = P(A)·P(B)  if independent</text>
  <text x="470" y="358" text-anchor="middle" font-size="11" fill="#374151">E(X) = Σ x·P(x)  (Expected value)</text>
  <text x="320" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#6D28D9">P(X=k) = C(n,k) p^k (1-p)^(n-k)  (Binomial)</text>
</svg>