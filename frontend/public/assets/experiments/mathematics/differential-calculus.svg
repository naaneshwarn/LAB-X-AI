<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#14532D">Differential Calculus: Derivatives</text>
  <!-- Graph f(x) and tangent -->
  <rect x="20" y="44" width="360" height="310" rx="12" fill="white" fill-opacity="0.9" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="200" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">f(x) = x³ − 3x  with tangent at x=2</text>
  <!-- Axes -->
  <line x1="40" y1="250" x2="362" y2="250" stroke="#374151" stroke-width="1.5"/>
  <line x1="192" y1="58" x2="192" y2="338" stroke="#374151" stroke-width="1.5"/>
  <text x="358" y="246" font-size="11" fill="#374151">x</text>
  <text x="188" y="58" font-size="11" fill="#374151">y</text>
  <!-- Cubic curve -->
  <path d="M46,320 Q80,310 120,290 Q160,260 192,250 Q220,240 248,220 Q290,165 335,80" fill="none" stroke="#22C55E" stroke-width="3"/>
  <!-- Tangent line at x=2 (which is roughly x=250 on graph) -->
  <line x1="150" y1="295" x2="340" y2="140" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="346" y="136" font-size="10" font-weight="700" fill="#B91C1C">tangent</text>
  <!-- Point of tangency -->
  <circle cx="250" cy="218" r="7" fill="#2563EB" stroke="white" stroke-width="2"/>
  <text x="260" y="214" font-size="10" font-weight="700" fill="#1D4ED8">(2, 2)</text>
  <!-- Rise/run for slope -->
  <line x1="210" y1="236" x2="250" y2="236" stroke="#A78BFA" stroke-width="1.5"/>
  <line x1="250" y1="218" x2="250" y2="236" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="232" y="246" font-size="9" fill="#6D28D9">Δx</text>
  <text x="254" y="230" font-size="9" fill="#6D28D9">Δy</text>
  <!-- Definition of derivative -->
  <text x="200" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">f'(x) = lim Δx→0 [f(x+Δx)−f(x)] / Δx</text>
  <!-- Derivative rules (right) -->
  <rect x="400" y="44" width="220" height="310" rx="12" fill="white" fill-opacity="0.9" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="510" y="70" text-anchor="middle" font-size="12" font-weight="800" fill="#14532D">Differentiation Rules</text>
  <text x="510" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">Power Rule</text>
  <text x="510" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#22C55E">d/dx [xⁿ] = n·xⁿ⁻¹</text>
  <text x="510" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">Chain Rule</text>
  <text x="510" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#22C55E">d/dx [f(g(x))] = f'(g)·g'</text>
  <text x="510" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">Product Rule</text>
  <text x="510" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#22C55E">d/dx [fg] = f'g + fg'</text>
  <text x="510" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">Common Derivatives</text>
  <text x="510" y="260" text-anchor="middle" font-size="11" fill="#374151">d/dx [sin x] = cos x</text>
  <text x="510" y="280" text-anchor="middle" font-size="11" fill="#374151">d/dx [eˣ] = eˣ</text>
  <text x="510" y="300" text-anchor="middle" font-size="11" fill="#374151">d/dx [ln x] = 1/x</text>
  <text x="510" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">Example: f(x)=x³−3x</text>
  <text x="510" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#22C55E">f'(x) = 3x²−3 = 9 at x=2</text>
</svg>