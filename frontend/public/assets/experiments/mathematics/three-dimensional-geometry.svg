<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <marker id="ax" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
    <marker id="vr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#4C1D95">3D Vectors &amp; Space Geometry</text>
  <!-- 3D coordinate system (left) -->
  <rect x="20" y="44" width="300" height="300" rx="12" fill="white" fill-opacity="0.9" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="170" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#4C1D95">3D Coordinate System</text>
  <!-- Origin -->
  <circle cx="170" cy="230" r="5" fill="#374151"/>
  <text x="158" y="250" font-size="11" fill="#374151">O</text>
  <!-- x-axis -->
  <line x1="170" y1="230" x2="290" y2="300" stroke="#EF4444" stroke-width="2.5" marker-end="url(#ax)"/>
  <text x="296" y="308" font-size="12" font-weight="700" fill="#B91C1C">x</text>
  <!-- y-axis -->
  <line x1="170" y1="230" x2="290" y2="160" stroke="#22C55E" stroke-width="2.5" marker-end="url(#ax)"/>
  <text x="296" y="156" font-size="12" font-weight="700" fill="#15803D">y</text>
  <!-- z-axis -->
  <line x1="170" y1="230" x2="80" y2="160" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ax)"/>
  <text x="68" y="156" font-size="12" font-weight="700" fill="#1D4ED8">z</text>
  <!-- Vector u -->
  <line x1="170" y1="230" x2="260" y2="120" stroke="#7C3AED" stroke-width="3" marker-end="url(#vr)"/>
  <text x="265" y="116" font-size="12" font-weight="700" fill="#6D28D9">u=(2,3,1)</text>
  <!-- Vector v -->
  <line x1="170" y1="230" x2="230" y2="310" stroke="#FB923C" stroke-width="3"/>
  <polygon points="225,305 235,318 238,305" fill="#FB923C"/>
  <text x="234" y="324" font-size="12" font-weight="700" fill="#EA580C">v=(1,−1,2)</text>
  <!-- Cross product label -->
  <text x="100" y="310" text-anchor="middle" font-size="10" fill="#6D28D9">u × v = ⊥ to both</text>
  <!-- Right: Formulas and 3D shapes -->
  <rect x="340" y="44" width="280" height="300" rx="12" fill="white" fill-opacity="0.9" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="480" y="70" text-anchor="middle" font-size="12" font-weight="800" fill="#4C1D95">Vector Formulas</text>
  <text x="480" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">|u| = √(x²+y²+z²) = √14</text>
  <text x="480" y="118" text-anchor="middle" font-size="11" fill="#374151">u·v = x₁x₂+y₁y₂+z₁z₂</text>
  <text x="480" y="138" text-anchor="middle" font-size="11" fill="#374151">= 2−3+2 = 1</text>
  <text x="480" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">cos θ = u·v / (|u||v|)</text>
  <text x="480" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">u × v = det|i  j  k|</text>
  <text x="480" y="206" text-anchor="middle" font-size="11" fill="#374151">       |2  3  1|</text>
  <text x="480" y="224" text-anchor="middle" font-size="11" fill="#374151">       |1 −1  2|</text>
  <!-- 3D Cube isometric -->
  <text x="480" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#4C1D95">Cube in 3D Space</text>
  <!-- Simple isometric cube drawing -->
  <polygon points="400,270 440,250 480,270 440,290" fill="#A78BFA" fill-opacity="0.5" stroke="#6D28D9" stroke-width="1.5"/>
  <polygon points="440,290 480,270 480,320 440,340" fill="#C4B5FD" fill-opacity="0.5" stroke="#6D28D9" stroke-width="1.5"/>
  <polygon points="400,270 440,250 440,300 400,320" fill="#818CF8" fill-opacity="0.5" stroke="#6D28D9" stroke-width="1.5"/>
  <polygon points="440,250 480,270 480,220 440,200" fill="#A78BFA" fill-opacity="0.5" stroke="#6D28D9" stroke-width="1.5"/>
  <!-- Sphere formula -->
  <text x="530" y="275" font-size="10" fill="#374151">x²+y²+z²=r²</text>
  <text x="530" y="295" font-size="10" fill="#374151">(Sphere)</text>
  <!-- Plane equation -->
  <text x="480" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#6D28D9">Plane: ax+by+cz = d</text>
</svg>