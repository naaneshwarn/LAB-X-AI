<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#C2410C">Integral Calculus &amp; Riemann Sums</text>
  <!-- Main Riemann sum graph -->
  <rect x="20" y="44" width="360" height="310" rx="12" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="200" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#C2410C">Riemann Sum for ∫₀³ x² dx</text>
  <!-- Axes -->
  <line x1="40" y1="316" x2="362" y2="316" stroke="#374151" stroke-width="1.5"/>
  <line x1="40" y1="78" x2="40" y2="320" stroke="#374151" stroke-width="1.5"/>
  <!-- Riemann bars -->
  <rect x="42" y="310" width="54" height="6" rx="2" fill="#FB923C" fill-opacity="0.7" stroke="#EA580C" stroke-width="1.5"/>
  <rect x="98" y="288" width="54" height="28" rx="2" fill="#FB923C" fill-opacity="0.7" stroke="#EA580C" stroke-width="1.5"/>
  <rect x="154" y="240" width="54" height="76" rx="2" fill="#FB923C" fill-opacity="0.7" stroke="#EA580C" stroke-width="1.5"/>
  <rect x="210" y="168" width="54" height="148" rx="2" fill="#FB923C" fill-opacity="0.7" stroke="#EA580C" stroke-width="1.5"/>
  <rect x="266" y="72" width="54" height="244" rx="2" fill="#FB923C" fill-opacity="0.7" stroke="#EA580C" stroke-width="1.5"/>
  <!-- Actual curve f(x) = x² -->
  <path d="M42,316 Q100,314 156,298 Q210,268 266,220 Q310,180 358,78" fill="none" stroke="#C2410C" stroke-width="3"/>
  <!-- x labels -->
  <text x="69" y="330" text-anchor="middle" font-size="10" fill="#374151">0.5</text>
  <text x="125" y="330" text-anchor="middle" font-size="10" fill="#374151">1</text>
  <text x="181" y="330" text-anchor="middle" font-size="10" fill="#374151">1.5</text>
  <text x="237" y="330" text-anchor="middle" font-size="10" fill="#374151">2</text>
  <text x="293" y="330" text-anchor="middle" font-size="10" fill="#374151">2.5</text>
  <text x="348" y="330" text-anchor="middle" font-size="10" fill="#374151">3</text>
  <!-- Shaded area label -->
  <text x="200" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#C2410C">Area ≈ Σ f(xₖ)·Δx</text>
  <text x="200" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#EA580C">= 9 (exact)</text>
  <!-- Right panel: Integration rules -->
  <rect x="400" y="44" width="220" height="310" rx="12" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="510" y="70" text-anchor="middle" font-size="12" font-weight="800" fill="#C2410C">Integration Rules</text>
  <text x="510" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">Power Rule</text>
  <text x="510" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#EA580C">∫xⁿ dx = xⁿ⁺¹/(n+1) + C</text>
  <text x="510" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">FTC (Fundamental)</text>
  <text x="510" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#EA580C">∫ₐᵇ f(x)dx = F(b)−F(a)</text>
  <text x="510" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">Common Integrals</text>
  <text x="510" y="218" text-anchor="middle" font-size="11" fill="#374151">∫sin x dx = −cos x + C</text>
  <text x="510" y="238" text-anchor="middle" font-size="11" fill="#374151">∫eˣ dx = eˣ + C</text>
  <text x="510" y="258" text-anchor="middle" font-size="11" fill="#374151">∫1/x dx = ln|x| + C</text>
  <text x="510" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">Example:</text>
  <text x="510" y="308" text-anchor="middle" font-size="11" fill="#374151">∫₀³ x² dx</text>
  <text x="510" y="328" text-anchor="middle" font-size="11" fill="#374151">= [x³/3]₀³</text>
  <text x="510" y="348" text-anchor="middle" font-size="13" font-weight="800" fill="#C2410C">= 27/3 = 9</text>
</svg>