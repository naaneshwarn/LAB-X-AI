<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#C2410C">Fractions &amp; Rational Arithmetic</text>
  <!-- Pie chart 3/4 -->
  <circle cx="120" cy="160" r="75" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <path d="M120,160 L120,85 A75,75 0 1,1 45,160 Z" fill="#FB923C"/>
  <text x="120" y="254" text-anchor="middle" font-size="20" font-weight="800" fill="#C2410C">3/4</text>
  <text x="120" y="274" text-anchor="middle" font-size="12" fill="#374151">= 0.75 = 75%</text>
  <!-- Bar fraction 2/5 -->
  <rect x="250" y="120" width="260" height="45" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <rect x="252" y="122" width="100" height="41" rx="4" fill="#34D399"/>
  <text x="380" y="174" text-anchor="middle" font-size="20" font-weight="800" fill="#059669">2/5 = 0.4</text>
  <!-- Operations box -->
  <rect x="250" y="200" width="260" height="150" rx="12" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="380" y="224" text-anchor="middle" font-size="12" font-weight="800" fill="#C2410C">Fraction Arithmetic</text>
  <text x="380" y="248" text-anchor="middle" font-size="12" fill="#374151">1/2 + 1/3 = 3/6 + 2/6 = 5/6</text>
  <text x="380" y="270" text-anchor="middle" font-size="12" fill="#374151">3/4 − 1/4 = 2/4 = 1/2</text>
  <text x="380" y="292" text-anchor="middle" font-size="12" fill="#374151">2/3 × 3/4 = 6/12 = 1/2</text>
  <text x="380" y="314" text-anchor="middle" font-size="12" fill="#374151">3/4 ÷ 1/2 = 3/4 × 2/1 = 3/2</text>
  <!-- Number line -->
  <rect x="20" y="315" width="600" height="70" rx="10" fill="white" fill-opacity="0.88" stroke="#FED7AA" stroke-width="1.5"/>
  <line x1="40" y1="345" x2="600" y2="345" stroke="#374151" stroke-width="2.5"/>
  <line x1="40" y1="338" x2="40" y2="352" stroke="#374151" stroke-width="2"/>
  <text x="40" y="362" text-anchor="middle" font-size="10" fill="#374151">0</text>
  <line x1="180" y1="338" x2="180" y2="352" stroke="#374151" stroke-width="2"/>
  <text x="180" y="362" text-anchor="middle" font-size="10" fill="#374151">1/4</text>
  <line x1="320" y1="338" x2="320" y2="352" stroke="#374151" stroke-width="2"/>
  <text x="320" y="362" text-anchor="middle" font-size="10" fill="#374151">1/2</text>
  <line x1="460" y1="338" x2="460" y2="352" stroke="#374151" stroke-width="2"/>
  <text x="460" y="362" text-anchor="middle" font-size="10" fill="#374151">3/4</text>
  <line x1="600" y1="338" x2="600" y2="352" stroke="#374151" stroke-width="2"/>
  <text x="600" y="362" text-anchor="middle" font-size="10" fill="#374151">1</text>
  <circle cx="180" cy="345" r="6" fill="#FB923C"/>
  <circle cx="320" cy="345" r="6" fill="#34D399"/>
</svg>