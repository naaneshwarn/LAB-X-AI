<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#1E3A8A">Matrices &amp; Linear Transformation</text>
  <!-- Matrix display (left) -->
  <rect x="20" y="52" width="285" height="310" rx="12" fill="white" fill-opacity="0.9" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="163" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#1E3A8A">Matrix Operations</text>
  <!-- Matrix A -->
  <text x="68" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">A =</text>
  <rect x="88" y="92" width="90" height="60" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="108" y="118" text-anchor="middle" font-size="13" fill="#1E3A8A">2  3</text>
  <text x="108" y="140" text-anchor="middle" font-size="13" fill="#1E3A8A">1  4</text>
  <!-- det(A) -->
  <text x="163" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">det(A) = 2×4 − 3×1 = 5</text>
  <!-- Inverse -->
  <text x="68" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">A⁻¹ =</text>
  <rect x="108" y="198" width="102" height="60" rx="4" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
  <text x="140" y="224" text-anchor="middle" font-size="13" fill="#14532D">4/5  −3/5</text>
  <text x="140" y="246" text-anchor="middle" font-size="13" fill="#14532D">−1/5  2/5</text>
  <text x="163" y="284" text-anchor="middle" font-size="12" fill="#374151">A × A⁻¹ = I (Identity)</text>
  <!-- Identity matrix -->
  <text x="68" y="318" text-anchor="middle" font-size="12" fill="#374151">I =</text>
  <rect x="88" y="300" width="80" height="52" rx="4" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2"/>
  <text x="128" y="324" text-anchor="middle" font-size="13" fill="#6D28D9">1  0</text>
  <text x="128" y="344" text-anchor="middle" font-size="13" fill="#6D28D9">0  1</text>
  <text x="210" y="318" text-anchor="middle" font-size="10" fill="#374151">2×2 Identity</text>
  <!-- Geometric transformation (right) -->
  <rect x="325" y="52" width="295" height="310" rx="12" fill="white" fill-opacity="0.9" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="473" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Matrix Transformation of Square</text>
  <!-- Coordinate system -->
  <line x1="345" y1="250" x2="600" y2="250" stroke="#374151" stroke-width="1.5"/>
  <line x1="473" y1="88" x2="473" y2="340" stroke="#374151" stroke-width="1.5"/>
  <!-- Original unit square -->
  <rect x="473" y="170" width="80" height="80" rx="2" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="513" y="260" text-anchor="middle" font-size="9" fill="#94A3B8">original</text>
  <!-- Transformed shape (shear/rotation) -->
  <polygon points="473,250 553,250 573,170 493,170" fill="#2563EB" fill-opacity="0.3" stroke="#2563EB" stroke-width="2.5"/>
  <text x="530" y="215" text-anchor="middle" font-size="9" font-weight="700" fill="#1D4ED8">Transformed</text>
  <!-- Transformation arrows -->
  <line x1="553" y1="250" x2="573" y2="250" stroke="#EF4444" stroke-width="2"/>
  <polygon points="568,244 580,250 568,256" fill="#EF4444"/>
  <text x="568" y="268" font-size="9" fill="#B91C1C">shear</text>
  <!-- Eigenvalue info -->
  <rect x="345" y="300" width="275" height="52" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="483" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Eigenvalues: det(A−λI) = 0</text>
  <text x="483" y="342" text-anchor="middle" font-size="11" fill="#374151">λ₁ = 1+√5 ≈ 3.24   λ₂ = 1−√5 ≈ −1.24</text>
</svg>