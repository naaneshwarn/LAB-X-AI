<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#C2410C">Cellular Respiration &amp; ATP Yield</text>
  <!-- Mitochondrion -->
  <ellipse cx="310" cy="230" rx="175" ry="130" fill="#FEF3C7" fill-opacity="0.8" stroke="#D97706" stroke-width="3"/>
  <!-- Inner membrane cristae -->
  <path d="M165,210 Q185,180 200,210 Q215,240 230,210" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <path d="M235,230 Q255,200 270,230 Q285,260 300,230" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <path d="M310,210 Q330,180 345,210 Q360,240 375,210" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <path d="M380,230 Q400,200 415,230 Q430,260 445,230" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="310" y="260" text-anchor="middle" font-size="10" fill="#A16207">Matrix (Krebs cycle)</text>
  <text x="310" y="275" text-anchor="middle" font-size="10" fill="#A16207">Inner membrane (ETC)</text>
  <!-- 3 Stages boxes (top) -->
  <!-- Glycolysis -->
  <rect x="30" y="52" width="168" height="90" rx="10" fill="#34D399" fill-opacity="0.9"/>
  <text x="114" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="white">Glycolysis</text>
  <text x="114" y="94" text-anchor="middle" font-size="10" fill="white">(Cytoplasm)</text>
  <text x="114" y="112" text-anchor="middle" font-size="10" fill="white">Glucose → 2 Pyruvate</text>
  <text x="114" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#ECFDF5">+2 ATP + 2 NADH</text>
  <!-- Krebs cycle -->
  <rect x="236" y="52" width="168" height="90" rx="10" fill="#FB923C" fill-opacity="0.9"/>
  <text x="320" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="white">Krebs Cycle</text>
  <text x="320" y="94" text-anchor="middle" font-size="10" fill="white">(Mitochondria matrix)</text>
  <text x="320" y="112" text-anchor="middle" font-size="10" fill="white">Pyruvate → CO₂</text>
  <text x="320" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF7ED">+2 ATP + 8 NADH + 2 FADH₂</text>
  <!-- ETC -->
  <rect x="442" y="52" width="178" height="90" rx="10" fill="#7C3AED" fill-opacity="0.9"/>
  <text x="531" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="white">Electron Transport</text>
  <text x="531" y="94" text-anchor="middle" font-size="10" fill="white">(Inner membrane)</text>
  <text x="531" y="112" text-anchor="middle" font-size="10" fill="white">NADH/FADH₂ → ATP</text>
  <text x="531" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#EDE9FE">+32–34 ATP</text>
  <!-- Arrows between stages -->
  <line x1="198" y1="97" x2="232" y2="97" stroke="#374151" stroke-width="2.5"/>
  <polygon points="226,90 240,97 226,104" fill="#374151"/>
  <line x1="404" y1="97" x2="438" y2="97" stroke="#374151" stroke-width="2.5"/>
  <polygon points="432,90 446,97 432,104" fill="#374151"/>
  <!-- Total ATP bar -->
  <rect x="80" y="348" width="480" height="40" rx="10" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="320" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">Total ATP yield: ~36–38 ATP per glucose molecule</text>
  <text x="320" y="382" text-anchor="middle" font-size="11" fill="#374151">C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + Energy (ATP)</text>
</svg>