<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#14532D">DNA Double Helix &amp; Replication</text>
  <!-- DNA double helix (left side) -->
  <!-- Backbone strands (sine waves) -->
  <!-- Strand 1 (blue) -->
  <path d="M80,60 Q100,80 120,100 Q140,120 120,140 Q100,160 120,180 Q140,200 120,220 Q100,240 120,260 Q140,280 120,300 Q100,320 120,340 Q140,360 120,380" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <!-- Strand 2 (red) -->
  <path d="M160,60 Q140,80 120,100 Q100,120 120,140 Q140,160 120,180 Q100,200 120,220 Q140,240 120,260 Q100,280 120,300 Q140,320 120,340 Q100,360 120,380" fill="none" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <!-- Base pairs (rungs) -->
  <line x1="90" y1="100" x2="150" y2="100" stroke="#34D399" stroke-width="3"/>
  <line x1="97" y1="130" x2="142" y2="130" stroke="#FBBF24" stroke-width="3"/>
  <line x1="90" y1="160" x2="150" y2="160" stroke="#34D399" stroke-width="3"/>
  <line x1="97" y1="192" x2="142" y2="192" stroke="#FB923C" stroke-width="3"/>
  <line x1="90" y1="222" x2="150" y2="222" stroke="#34D399" stroke-width="3"/>
  <line x1="97" y1="254" x2="142" y2="254" stroke="#FBBF24" stroke-width="3"/>
  <line x1="90" y1="285" x2="150" y2="285" stroke="#34D399" stroke-width="3"/>
  <line x1="97" y1="316" x2="142" y2="316" stroke="#FB923C" stroke-width="3"/>
  <!-- Base labels -->
  <text x="118" y="96" text-anchor="middle" font-size="9" fill="#065F46">A — T</text>
  <text x="118" y="126" text-anchor="middle" font-size="9" fill="#92400E">G — C</text>
  <text x="118" y="156" text-anchor="middle" font-size="9" fill="#065F46">A — T</text>
  <text x="118" y="188" text-anchor="middle" font-size="9" fill="#C2410C">C — G</text>
  <text x="118" y="218" text-anchor="middle" font-size="9" fill="#065F46">T — A</text>
  <text x="118" y="250" text-anchor="middle" font-size="9" fill="#92400E">G — C</text>
  <!-- Replication fork (right side) -->
  <text x="400" y="52" text-anchor="middle" font-size="13" font-weight="800" fill="#14532D">Semi-Conservative Replication</text>
  <!-- Parent strands unwinding -->
  <path d="M300,70 Q340,90 350,120 Q360,150 350,180 Q340,210 350,240" fill="none" stroke="#2563EB" stroke-width="4"/>
  <path d="M400,70 Q360,90 350,120 Q340,150 350,180 Q360,210 350,240" fill="none" stroke="#EF4444" stroke-width="4"/>
  <!-- New strand on blue side -->
  <path d="M380,150 Q390,160 395,180 Q400,200 395,230 Q390,250 400,270" fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="6,3"/>
  <!-- New strand on red side -->
  <path d="M320,150 Q310,160 305,180 Q300,200 305,230 Q310,250 300,270" fill="none" stroke="#A78BFA" stroke-width="3" stroke-dasharray="6,3"/>
  <!-- Helicase at fork -->
  <circle cx="350" cy="130" r="22" fill="#FBBF24" stroke="#D97706" stroke-width="2.5"/>
  <text x="350" y="128" text-anchor="middle" font-size="9" font-weight="700" fill="white">Helicase</text>
  <text x="350" y="142" text-anchor="middle" font-size="8" fill="white">unwinds</text>
  <!-- DNA polymerase -->
  <circle cx="393" cy="195" r="18" fill="#FB923C" stroke="#EA580C" stroke-width="2"/>
  <text x="393" y="192" text-anchor="middle" font-size="8" font-weight="700" fill="white">DNA Pol</text>
  <text x="393" y="204" text-anchor="middle" font-size="7" fill="white">III</text>
  <circle cx="307" cy="195" r="18" fill="#FB923C" stroke="#EA580C" stroke-width="2"/>
  <text x="307" y="192" text-anchor="middle" font-size="8" font-weight="700" fill="white">DNA Pol</text>
  <text x="307" y="204" text-anchor="middle" font-size="7" fill="white">III</text>
  <!-- Product strands (bottom) -->
  <text x="350" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">2 identical double helices</text>
  <ellipse cx="310" cy="345" rx="50" ry="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="310" y="349" text-anchor="middle" font-size="9" font-weight="700" fill="#1D4ED8">Daughter 1</text>
  <ellipse cx="400" cy="345" rx="50" ry="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="400" y="349" text-anchor="middle" font-size="9" font-weight="700" fill="#1D4ED8">Daughter 2</text>
  <!-- Rules box right -->
  <rect x="470" y="60" width="158" height="130" rx="10" fill="white" fill-opacity="0.9" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="549" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#14532D">Base Pairing Rules</text>
  <text x="549" y="102" text-anchor="middle" font-size="12" font-weight="800" fill="#2563EB">A ≡ T</text>
  <text x="549" y="122" text-anchor="middle" font-size="12" font-weight="800" fill="#059669">G ≡ C</text>
  <text x="549" y="150" text-anchor="middle" font-size="10" fill="#374151">Chargaff's Rules</text>
  <text x="549" y="168" text-anchor="middle" font-size="10" fill="#374151">%A = %T, %G = %C</text>
</svg>