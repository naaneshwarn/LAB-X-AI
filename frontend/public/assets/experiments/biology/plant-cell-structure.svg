<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#14532D">Plant Cell Structure &amp; Organelles</text>
  <!-- Cell wall (outer) -->
  <rect x="80" y="50" width="390" height="300" rx="12" fill="#86EFAC" fill-opacity="0.3" stroke="#16A34A" stroke-width="5"/>
  <!-- Cell membrane (inner) -->
  <rect x="92" y="62" width="366" height="276" rx="8" fill="#A7F3D0" fill-opacity="0.3" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Large central vacuole -->
  <ellipse cx="250" cy="220" rx="100" ry="85" fill="#BFDBFE" fill-opacity="0.7" stroke="#2563EB" stroke-width="1.5"/>
  <text x="250" y="225" text-anchor="middle" font-size="10" fill="#1D4ED8" font-weight="700">Central Vacuole</text>
  <!-- Nucleus -->
  <ellipse cx="380" cy="145" rx="52" ry="40" fill="#A78BFA" fill-opacity="0.8" stroke="#6D28D9" stroke-width="2.5"/>
  <ellipse cx="380" cy="145" rx="22" ry="17" fill="#7C3AED" fill-opacity="0.9"/>
  <text x="380" y="150" text-anchor="middle" font-size="9" font-weight="700" fill="white">Nucleolus</text>
  <text x="380" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#6D28D9">Nucleus</text>
  <!-- Chloroplasts -->
  <ellipse cx="145" cy="130" rx="30" ry="18" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <text x="145" y="134" text-anchor="middle" font-size="9" font-weight="700" fill="white">Chloroplast</text>
  <ellipse cx="175" cy="98" rx="30" ry="18" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <ellipse cx="175" cy="310" rx="30" ry="18" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <text x="175" y="314" text-anchor="middle" font-size="8" fill="white">Chloroplast</text>
  <!-- Mitochondria -->
  <ellipse cx="400" cy="275" rx="28" ry="16" fill="#FB923C" fill-opacity="0.9" stroke="#EA580C" stroke-width="2"/>
  <text x="400" y="279" text-anchor="middle" font-size="9" font-weight="700" fill="white">Mitochond.</text>
  <!-- Golgi -->
  <path d="M120,230 Q155,222 155,238 Q155,254 120,246 Q120,238 120,230" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
  <path d="M125,240 Q160,232 160,248 Q160,260 125,254 Q125,248 125,240" fill="#FCD34D" stroke="#D97706" stroke-width="1"/>
  <text x="135" y="275" text-anchor="middle" font-size="9" font-weight="700" fill="#D97706">Golgi</text>
  <!-- ER (rough) -->
  <path d="M310,80 Q330,72 350,80 Q370,88 390,80" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <text x="350" y="68" text-anchor="middle" font-size="9" fill="#374151">Rough ER</text>
  <!-- Ribosome dots on ER -->
  <circle cx="320" cy="80" r="3" fill="#374151"/>
  <circle cx="334" cy="77" r="3" fill="#374151"/>
  <circle cx="348" cy="80" r="3" fill="#374151"/>
  <!-- Labels right side -->
  <rect x="488" y="52" width="140" height="288" rx="10" fill="white" fill-opacity="0.88" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="558" y="74" text-anchor="middle" font-size="11" font-weight="800" fill="#14532D">Unique to Plants</text>
  <text x="558" y="96" text-anchor="middle" font-size="10" fill="#16A34A">✓ Cell Wall</text>
  <text x="558" y="114" text-anchor="middle" font-size="10" fill="#16A34A">✓ Central Vacuole</text>
  <text x="558" y="132" text-anchor="middle" font-size="10" fill="#16A34A">✓ Chloroplasts</text>
  <text x="558" y="150" text-anchor="middle" font-size="10" fill="#16A34A">✓ Plasmodesmata</text>
  <text x="558" y="180" text-anchor="middle" font-size="11" font-weight="800" fill="#14532D">All Cells Have</text>
  <text x="558" y="200" text-anchor="middle" font-size="10" fill="#374151">• Nucleus</text>
  <text x="558" y="218" text-anchor="middle" font-size="10" fill="#374151">• Mitochondria</text>
  <text x="558" y="236" text-anchor="middle" font-size="10" fill="#374151">• Ribosomes</text>
  <text x="558" y="254" text-anchor="middle" font-size="10" fill="#374151">• Golgi Body</text>
  <text x="558" y="272" text-anchor="middle" font-size="10" fill="#374151">• ER (rough/smooth)</text>
  <text x="558" y="290" text-anchor="middle" font-size="10" fill="#374151">• Cell Membrane</text>
  <text x="558" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">SA:V = 6/L</text>
  <text x="558" y="332" text-anchor="middle" font-size="10" fill="#374151">smaller cells → better</text>
</svg>