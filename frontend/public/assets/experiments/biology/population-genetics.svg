<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#4C1D95">Population Genetics &amp; Hardy-Weinberg</text>
  <!-- Hardy-Weinberg triangle diagram -->
  <rect x="20" y="52" width="300" height="310" rx="12" fill="white" fill-opacity="0.9" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="170" y="76" text-anchor="middle" font-size="12" font-weight="800" fill="#4C1D95">Hardy-Weinberg Frequencies</text>
  <!-- Axes -->
  <line x1="50" y1="310" x2="300" y2="310" stroke="#374151" stroke-width="1.5"/>
  <line x1="50" y1="90" x2="50" y2="314" stroke="#374151" stroke-width="1.5"/>
  <text x="175" y="336" text-anchor="middle" font-size="11" fill="#374151">Allele frequency p</text>
  <text x="30" y="200" text-anchor="middle" font-size="11" fill="#374151" transform="rotate(-90,30,200)">Genotype freq.</text>
  <!-- p² (AA) -->
  <path d="M50,310 Q175,310 300,90" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <text x="260" y="102" font-size="10" font-weight="700" fill="#1D4ED8">p² (AA)</text>
  <!-- q² (aa) -->
  <path d="M50,90 Q175,310 300,310" fill="none" stroke="#EF4444" stroke-width="2.5"/>
  <text x="40" y="88" font-size="10" font-weight="700" fill="#B91C1C">q² (aa)</text>
  <!-- 2pq (Aa) bell -->
  <path d="M50,310 Q175,160 300,310" fill="#A78BFA" fill-opacity="0.3" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="175" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#6D28D9">2pq (Aa)</text>
  <text x="175" y="246" text-anchor="middle" font-size="9" fill="#6D28D9">peak at p=0.5</text>
  <!-- Equilibrium conditions -->
  <rect x="348" y="52" width="270" height="230" rx="12" fill="white" fill-opacity="0.9" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="483" y="76" text-anchor="middle" font-size="12" font-weight="800" fill="#4C1D95">H-W Equation</text>
  <rect x="362" y="86" width="242" height="52" rx="8" fill="#A78BFA" fill-opacity="0.3"/>
  <text x="483" y="108" text-anchor="middle" font-size="16" font-weight="800" fill="#6D28D9">p² + 2pq + q² = 1</text>
  <text x="483" y="128" text-anchor="middle" font-size="10" fill="#374151">p + q = 1</text>
  <text x="483" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#4C1D95">H-W Conditions</text>
  <text x="483" y="176" text-anchor="middle" font-size="10" fill="#374151">1. No natural selection</text>
  <text x="483" y="194" text-anchor="middle" font-size="10" fill="#374151">2. No mutation</text>
  <text x="483" y="212" text-anchor="middle" font-size="10" fill="#374151">3. No genetic drift</text>
  <text x="483" y="230" text-anchor="middle" font-size="10" fill="#374151">4. No gene flow</text>
  <text x="483" y="248" text-anchor="middle" font-size="10" fill="#374151">5. Random mating</text>
  <text x="483" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">(rarely met in real populations!)</text>
  <!-- Example calculation -->
  <rect x="348" y="298" width="270" height="80" rx="12" fill="#A78BFA" fill-opacity="0.3" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="483" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#4C1D95">Example: albinism q²=0.04</text>
  <text x="483" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">q = 0.2 → p = 0.8</text>
  <text x="483" y="358" text-anchor="middle" font-size="11" fill="#374151">Carriers (2pq) = 32% of population</text>
</svg>