<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#4C1D95">Mitosis &amp; Meiosis Cell Division</text>
  <!-- MITOSIS label -->
  <text x="160" y="52" text-anchor="middle" font-size="14" font-weight="800" fill="#6D28D9">MITOSIS</text>
  <!-- Prophase -->
  <ellipse cx="55" cy="130" rx="38" ry="35" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="55" y="175" text-anchor="middle" font-size="9" font-weight="700" fill="#6D28D9">Prophase</text>
  <line x1="42" y1="118" x2="68" y2="142" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="68" y1="118" x2="42" y2="142" stroke="#6D28D9" stroke-width="2.5"/>
  <!-- Metaphase -->
  <ellipse cx="145" cy="130" rx="38" ry="35" fill="#DDD6FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="145" y="175" text-anchor="middle" font-size="9" font-weight="700" fill="#6D28D9">Metaphase</text>
  <line x1="145" y1="96" x2="145" y2="164" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="130" y1="128" x2="145" y2="134" stroke="#7C3AED" stroke-width="2"/>
  <line x1="160" y1="128" x2="145" y2="134" stroke="#6D28D9" stroke-width="2"/>
  <line x1="130" y1="136" x2="145" y2="128" stroke="#7C3AED" stroke-width="2"/>
  <line x1="160" y1="136" x2="145" y2="128" stroke="#6D28D9" stroke-width="2"/>
  <!-- Anaphase -->
  <ellipse cx="235" cy="130" rx="38" ry="35" fill="#C4B5FD" stroke="#7C3AED" stroke-width="2"/>
  <text x="235" y="175" text-anchor="middle" font-size="9" font-weight="700" fill="#6D28D9">Anaphase</text>
  <line x1="223" y1="112" x2="223" y2="150" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="247" y1="112" x2="247" y2="150" stroke="#6D28D9" stroke-width="2.5"/>
  <!-- Telophase / 2 cells -->
  <ellipse cx="305" cy="118" rx="30" ry="24" fill="#A78BFA" stroke="#7C3AED" stroke-width="2"/>
  <ellipse cx="305" cy="148" rx="30" ry="24" fill="#A78BFA" stroke="#7C3AED" stroke-width="2"/>
  <text x="305" y="183" text-anchor="middle" font-size="9" font-weight="700" fill="#6D28D9">Telophase → 2 cells (2n)</text>
  <!-- MEIOSIS label -->
  <text x="490" y="52" text-anchor="middle" font-size="14" font-weight="800" fill="#B91C1C">MEIOSIS</text>
  <!-- Meiosis I -->
  <ellipse cx="380" cy="130" rx="38" ry="35" fill="#FFE4E6" stroke="#BE123C" stroke-width="2"/>
  <text x="380" y="175" text-anchor="middle" font-size="9" font-weight="700" fill="#B91C1C">Meiosis I</text>
  <line x1="367" y1="116" x2="393" y2="144" stroke="#BE123C" stroke-width="2.5"/>
  <line x1="393" y1="116" x2="367" y2="144" stroke="#E11D48" stroke-width="2.5"/>
  <!-- Crossing over symbol -->
  <text x="380" y="134" text-anchor="middle" font-size="10" fill="#9F1239">✕</text>
  <text x="380" y="162" text-anchor="middle" font-size="8" fill="#9F1239">crossing over</text>
  <!-- Meiosis I products -->
  <ellipse cx="460" cy="118" rx="28" ry="22" fill="#FECDD3" stroke="#BE123C" stroke-width="2"/>
  <ellipse cx="460" cy="148" rx="28" ry="22" fill="#FECDD3" stroke="#BE123C" stroke-width="2"/>
  <text x="460" y="181" text-anchor="middle" font-size="9" font-weight="700" fill="#B91C1C">2 cells (n)</text>
  <!-- Meiosis II (4 cells) -->
  <ellipse cx="533" cy="104" rx="22" ry="18" fill="#FDA4AF" stroke="#BE123C" stroke-width="1.5"/>
  <ellipse cx="533" cy="136" rx="22" ry="18" fill="#FDA4AF" stroke="#BE123C" stroke-width="1.5"/>
  <ellipse cx="590" cy="104" rx="22" ry="18" fill="#FDA4AF" stroke="#BE123C" stroke-width="1.5"/>
  <ellipse cx="590" cy="136" rx="22" ry="18" fill="#FDA4AF" stroke="#BE123C" stroke-width="1.5"/>
  <text x="560" y="172" text-anchor="middle" font-size="9" font-weight="700" fill="#B91C1C">4 gametes (n)</text>
  <!-- Comparison table bottom -->
  <rect x="20" y="200" width="600" height="180" rx="12" fill="white" fill-opacity="0.88" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="320" y="224" text-anchor="middle" font-size="13" font-weight="800" fill="#1E293B">Comparison</text>
  <line x1="30" y1="232" x2="610" y2="232" stroke="#E2E8F0" stroke-width="1"/>
  <text x="175" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">Mitosis</text>
  <text x="490" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">Meiosis</text>
  <line x1="320" y1="235" x2="320" y2="372" stroke="#E2E8F0" stroke-width="1"/>
  <text x="175" y="276" text-anchor="middle" font-size="10" fill="#374151">1 division</text>
  <text x="490" y="276" text-anchor="middle" font-size="10" fill="#374151">2 divisions</text>
  <text x="175" y="296" text-anchor="middle" font-size="10" fill="#374151">2 identical daughter cells</text>
  <text x="490" y="296" text-anchor="middle" font-size="10" fill="#374151">4 unique gametes</text>
  <text x="175" y="316" text-anchor="middle" font-size="10" fill="#374151">Same chromosome number (2n)</text>
  <text x="490" y="316" text-anchor="middle" font-size="10" fill="#374151">Half number (n)</text>
  <text x="175" y="336" text-anchor="middle" font-size="10" fill="#374151">Growth &amp; repair</text>
  <text x="490" y="336" text-anchor="middle" font-size="10" fill="#374151">Sexual reproduction</text>
  <text x="175" y="356" text-anchor="middle" font-size="10" fill="#374151">No crossing over</text>
  <text x="490" y="356" text-anchor="middle" font-size="10" fill="#374151">Crossing over → variation</text>
</svg>