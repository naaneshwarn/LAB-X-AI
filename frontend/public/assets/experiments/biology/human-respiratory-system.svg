<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#9F1239">Human Respiratory System</text>
  <!-- Nasal cavity -->
  <ellipse cx="300" cy="62" rx="25" ry="18" fill="#FECDD3" stroke="#BE123C" stroke-width="1.5"/>
  <text x="250" y="62" text-anchor="end" font-size="9" font-weight="700" fill="#9F1239">Nasal cavity</text>
  <!-- Mouth -->
  <rect x="275" y="80" width="50" height="18" rx="6" fill="#FECDD3" stroke="#BE123C" stroke-width="1.5"/>
  <!-- Pharynx -->
  <rect x="287" y="98" width="26" height="20" rx="4" fill="#FDA4AF" stroke="#BE123C" stroke-width="1.5"/>
  <text x="322" y="112" font-size="9" fill="#9F1239">Pharynx</text>
  <!-- Larynx -->
  <rect x="287" y="118" width="26" height="16" rx="4" fill="#FB7185" stroke="#BE123C" stroke-width="1.5"/>
  <text x="322" y="130" font-size="9" fill="#9F1239">Larynx</text>
  <!-- Trachea -->
  <rect x="293" y="134" width="14" height="55" rx="4" fill="#FDA4AF" stroke="#BE123C" stroke-width="2"/>
  <text x="316" y="165" font-size="9" fill="#9F1239">Trachea</text>
  <!-- Bronchi split -->
  <path d="M300,189 Q260,195 220,210" fill="none" stroke="#BE123C" stroke-width="4" stroke-linecap="round"/>
  <path d="M300,189 Q340,195 380,210" fill="none" stroke="#BE123C" stroke-width="4" stroke-linecap="round"/>
  <text x="200" y="208" text-anchor="end" font-size="9" fill="#9F1239">Left bronchus</text>
  <text x="400" y="208" font-size="9" fill="#9F1239">Right bronchus</text>
  <!-- Left lung -->
  <path d="M165,215 Q128,222 118,250 Q108,280 120,315 Q138,348 175,352 Q210,355 230,340 Q248,325 245,295 Q242,265 235,240 Q225,215 200,210 Z" fill="#FB7185" fill-opacity="0.75" stroke="#BE123C" stroke-width="2.5"/>
  <text x="175" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#9F1239">Left</text>
  <text x="175" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#9F1239">Lung</text>
  <!-- Right lung -->
  <path d="M435,215 Q472,222 482,250 Q492,280 480,315 Q462,348 425,352 Q390,355 370,340 Q352,325 355,295 Q358,265 365,240 Q375,215 400,210 Z" fill="#FB7185" fill-opacity="0.75" stroke="#BE123C" stroke-width="2.5"/>
  <text x="425" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#9F1239">Right</text>
  <text x="425" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#9F1239">Lung</text>
  <!-- Bronchioles inside lungs -->
  <path d="M230,245 Q210,265 205,285" fill="none" stroke="#E11D48" stroke-width="1.5"/>
  <path d="M230,245 Q218,270 220,295" fill="none" stroke="#E11D48" stroke-width="1.5"/>
  <path d="M235,255 Q230,278 232,305" fill="none" stroke="#E11D48" stroke-width="1.5"/>
  <path d="M370,245 Q390,265 395,285" fill="none" stroke="#E11D48" stroke-width="1.5"/>
  <path d="M370,245 Q382,270 380,295" fill="none" stroke="#E11D48" stroke-width="1.5"/>
  <path d="M365,255 Q370,278 368,305" fill="none" stroke="#E11D48" stroke-width="1.5"/>
  <!-- Diaphragm -->
  <path d="M100,355 Q200,340 300,370 Q400,340 500,355" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <text x="300" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">Diaphragm</text>
  <!-- Alveoli cluster -->
  <circle cx="204" cy="310" r="12" fill="#FECDD3" stroke="#E11D48" stroke-width="1.5"/>
  <circle cx="224" cy="316" r="10" fill="#FECDD3" stroke="#E11D48" stroke-width="1.5"/>
  <circle cx="214" cy="296" r="10" fill="#FECDD3" stroke="#E11D48" stroke-width="1.5"/>
  <text x="175" y="340" text-anchor="middle" font-size="8" fill="#9F1239">Alveoli</text>
  <!-- Breathing labels -->
  <rect x="490" y="52" width="138" height="140" rx="10" fill="white" fill-opacity="0.9" stroke="#FECDD3" stroke-width="1.5"/>
  <text x="559" y="74" text-anchor="middle" font-size="11" font-weight="800" fill="#9F1239">Breathing</text>
  <text x="559" y="94" text-anchor="middle" font-size="10" fill="#374151">Inhale: O₂ in</text>
  <text x="559" y="112" text-anchor="middle" font-size="10" fill="#374151">diaphragm contracts</text>
  <text x="559" y="130" text-anchor="middle" font-size="10" fill="#374151">Exhale: CO₂ out</text>
  <text x="559" y="148" text-anchor="middle" font-size="10" fill="#374151">diaphragm relaxes</text>
  <text x="559" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">12–20 breaths/min</text>
</svg>