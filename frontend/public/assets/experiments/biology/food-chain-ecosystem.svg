<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#14532D">Food Chain &amp; Energy Pyramid</text>
  <!-- Energy pyramid (left) -->
  <polygon points="80,350 240,350 300,60" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Level 4: Tertiary consumer (apex) -->
  <polygon points="274,60 300,60 290,100 265,100" fill="#EF4444"/>
  <text x="295" y="85" font-size="9" font-weight="700" fill="#B91C1C">Top Pred.</text>
  <!-- Level 3: Secondary consumer -->
  <polygon points="258,100 295,100 280,160 243,160" fill="#FB923C"/>
  <text x="265" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="white">Secondary</text>
  <!-- Level 2: Primary consumer -->
  <polygon points="230,160 282,160 262,240 215,240" fill="#FBBF24"/>
  <text x="248" y="210" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">Primary</text>
  <!-- Level 1: Producers -->
  <polygon points="195,240 268,240 240,350 160,350" fill="#22C55E"/>
  <text x="215" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="white">Producers</text>
  <!-- Energy labels -->
  <text x="68" y="340" text-anchor="end" font-size="10" fill="#15803D">10,000 kcal</text>
  <text x="68" y="230" text-anchor="end" font-size="10" fill="#D97706">1,000 kcal</text>
  <text x="68" y="150" text-anchor="end" font-size="10" fill="#EA580C">100 kcal</text>
  <text x="68" y="92" text-anchor="end" font-size="10" fill="#B91C1C">10 kcal</text>
  <text x="90" y="370" font-size="10" font-weight="700" fill="#374151">10% rule: only 10% energy transferred per level</text>
  <!-- Food chain (right, linear) -->
  <text x="450" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#14532D">Linear Food Chain</text>
  <!-- Sun -->
  <circle cx="360" cy="105" r="25" fill="#FEF08A" stroke="#FBBF24" stroke-width="2.5"/>
  <text x="360" y="109" text-anchor="middle" font-size="10" font-weight="700" fill="#D97706">SUN</text>
  <!-- Arrow down -->
  <line x1="360" y1="130" x2="360" y2="145" stroke="#374151" stroke-width="2"/>
  <polygon points="354,143 360,156 366,143" fill="#374151"/>
  <!-- Grass (producer) -->
  <rect x="330" y="156" width="60" height="34" rx="8" fill="#22C55E"/>
  <text x="360" y="176" text-anchor="middle" font-size="10" font-weight="700" fill="white">Grass 🌿</text>
  <line x1="360" y1="190" x2="360" y2="205" stroke="#374151" stroke-width="2"/>
  <polygon points="354,203 360,216 366,203" fill="#374151"/>
  <!-- Grasshopper (primary) -->
  <rect x="318" y="216" width="84" height="34" rx="8" fill="#86EFAC" stroke="#15803D" stroke-width="1.5"/>
  <text x="360" y="236" text-anchor="middle" font-size="10" font-weight="700" fill="#14532D">Grasshopper 🦗</text>
  <line x1="360" y1="250" x2="360" y2="265" stroke="#374151" stroke-width="2"/>
  <polygon points="354,263 360,276 366,263" fill="#374151"/>
  <!-- Frog (secondary) -->
  <rect x="318" y="276" width="84" height="34" rx="8" fill="#FBBF24"/>
  <text x="360" y="296" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">Frog 🐸</text>
  <line x1="360" y1="310" x2="360" y2="325" stroke="#374151" stroke-width="2"/>
  <polygon points="354,323 360,336 366,323" fill="#374151"/>
  <!-- Eagle (tertiary) -->
  <rect x="314" y="336" width="92" height="34" rx="8" fill="#EF4444"/>
  <text x="360" y="356" text-anchor="middle" font-size="10" font-weight="700" fill="white">Eagle 🦅</text>
  <!-- Right info box -->
  <rect x="488" y="52" width="140" height="180" rx="10" fill="white" fill-opacity="0.9" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="558" y="74" text-anchor="middle" font-size="11" font-weight="800" fill="#14532D">Trophic Levels</text>
  <text x="558" y="96" text-anchor="middle" font-size="10" fill="#374151">L1: Producers</text>
  <text x="558" y="114" text-anchor="middle" font-size="10" fill="#374151">L2: Primary consumers</text>
  <text x="558" y="132" text-anchor="middle" font-size="10" fill="#374151">L3: Secondary cons.</text>
  <text x="558" y="150" text-anchor="middle" font-size="10" fill="#374151">L4: Tertiary cons.</text>
  <text x="558" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">10% Rule</text>
  <text x="558" y="195" text-anchor="middle" font-size="10" fill="#374151">Only 10% of energy</text>
  <text x="558" y="213" text-anchor="middle" font-size="10" fill="#374151">passes to next level</text>
  <text x="558" y="230" text-anchor="middle" font-size="10" fill="#374151">Rest lost as heat</text>
</svg>