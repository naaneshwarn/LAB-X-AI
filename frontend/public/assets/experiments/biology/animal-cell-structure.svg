<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#9F1239">Animal Cell Structure</text>
  <!-- Cell membrane (irregular rounded) -->
  <ellipse cx="290" cy="215" rx="210" ry="168" fill="#FFE4E6" fill-opacity="0.7" stroke="#BE123C" stroke-width="3"/>
  <!-- Nucleus -->
  <ellipse cx="275" cy="195" rx="68" ry="55" fill="#A78BFA" fill-opacity="0.85" stroke="#6D28D9" stroke-width="2.5"/>
  <ellipse cx="275" cy="195" rx="28" ry="22" fill="#7C3AED"/>
  <text x="275" y="199" text-anchor="middle" font-size="9" font-weight="700" fill="white">Nucleolus</text>
  <text x="275" y="265" text-anchor="middle" font-size="10" font-weight="700" fill="#6D28D9">Nucleus</text>
  <!-- Mitochondria (multiple) -->
  <ellipse cx="175" cy="140" rx="30" ry="18" fill="#FB923C" stroke="#EA580C" stroke-width="2"/>
  <text x="175" y="144" text-anchor="middle" font-size="8" font-weight="700" fill="white">Mitochon.</text>
  <ellipse cx="400" cy="150" rx="28" ry="17" fill="#FB923C" stroke="#EA580C" stroke-width="2"/>
  <text x="400" y="154" text-anchor="middle" font-size="8" fill="white">Mitochon.</text>
  <ellipse cx="380" cy="285" rx="28" ry="17" fill="#FB923C" stroke="#EA580C" stroke-width="2"/>
  <text x="380" y="289" text-anchor="middle" font-size="8" fill="white">Mitochon.</text>
  <!-- Golgi apparatus -->
  <path d="M140,230 Q185,220 185,240 Q185,255 140,247 Q140,238 140,230" fill="#FCD34D" stroke="#D97706" stroke-width="1.5"/>
  <path d="M145,242 Q192,232 192,252 Q192,264 145,258 Q145,252 145,242" fill="#FEF08A" stroke="#D97706" stroke-width="1"/>
  <text x="160" y="276" text-anchor="middle" font-size="9" font-weight="700" fill="#D97706">Golgi</text>
  <!-- Lysosomes -->
  <circle cx="440" cy="225" r="16" fill="#34D399" stroke="#059669" stroke-width="2"/>
  <text x="440" y="229" text-anchor="middle" font-size="8" font-weight="700" fill="white">Lyso.</text>
  <circle cx="410" cy="260" r="12" fill="#34D399" stroke="#059669" stroke-width="2"/>
  <!-- Centrosome/centriole -->
  <rect x="350" y="140" width="16" height="16" rx="2" fill="#94A3B8" stroke="#64748B" stroke-width="1.5" transform="rotate(30 358 148)"/>
  <text x="368" y="135" font-size="9" fill="#374151">Centriole</text>
  <!-- Small vacuoles -->
  <circle cx="185" cy="300" r="14" fill="#BAE6FD" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="185" y="304" text-anchor="middle" font-size="7" fill="#0369A1">Vacuole</text>
  <!-- ER -->
  <path d="M205,160 Q225,152 245,160 Q265,168 285,160" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="215" cy="160" r="3" fill="#374151"/>
  <circle cx="230" cy="156" r="3" fill="#374151"/>
  <circle cx="245" cy="160" r="3" fill="#374151"/>
  <text x="245" y="148" font-size="8" fill="#374151">Rough ER</text>
  <!-- Labels right panel -->
  <rect x="510" y="52" width="118" height="288" rx="10" fill="white" fill-opacity="0.88" stroke="#FECDD3" stroke-width="1.5"/>
  <text x="569" y="74" text-anchor="middle" font-size="11" font-weight="800" fill="#9F1239">Animal Only</text>
  <text x="569" y="94" text-anchor="middle" font-size="10" fill="#B91C1C">✓ Centrioles</text>
  <text x="569" y="112" text-anchor="middle" font-size="10" fill="#B91C1C">✓ Lysosomes</text>
  <text x="569" y="130" text-anchor="middle" font-size="10" fill="#B91C1C">✗ No Cell Wall</text>
  <text x="569" y="148" text-anchor="middle" font-size="10" fill="#B91C1C">✗ No Chloroplast</text>
  <text x="569" y="166" text-anchor="middle" font-size="10" fill="#B91C1C">✗ No Large Vacuole</text>
  <text x="569" y="195" text-anchor="middle" font-size="11" font-weight="800" fill="#9F1239">SA : V Ratio</text>
  <text x="569" y="215" text-anchor="middle" font-size="10" fill="#374151">SA = 4πr²</text>
  <text x="569" y="233" text-anchor="middle" font-size="10" fill="#374151">V = 4/3 πr³</text>
  <text x="569" y="251" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">SA/V = 3/r</text>
  <text x="569" y="275" text-anchor="middle" font-size="10" fill="#374151">smaller r →</text>
  <text x="569" y="291" text-anchor="middle" font-size="10" fill="#374151">higher SA/V</text>
  <text x="569" y="310" text-anchor="middle" font-size="10" fill="#374151">better exchange</text>
  <text x="569" y="328" text-anchor="middle" font-size="10" fill="#374151">of substances</text>
</svg>