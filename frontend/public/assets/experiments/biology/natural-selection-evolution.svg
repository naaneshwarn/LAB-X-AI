<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#C2410C">Natural Selection &amp; Evolution</text>
  <!-- Peppered moth example (left) -->
  <rect x="20" y="52" width="280" height="250" rx="12" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="160" y="76" text-anchor="middle" font-size="12" font-weight="800" fill="#C2410C">Peppered Moth Example</text>
  <!-- Light tree bark (pre-industrial) -->
  <rect x="30" y="88" width="118" height="200" rx="6" fill="#E2E8F0"/>
  <text x="89" y="108" text-anchor="middle" font-size="10" fill="#374151">Light bark</text>
  <!-- Light moths (many visible) -->
  <ellipse cx="55" cy="140" rx="10" ry="6" fill="#E5E7EB" stroke="#94A3B8" stroke-width="1"/><text x="72" y="143" font-size="9" fill="#6B7280">Light (hidden)</text>
  <ellipse cx="55" cy="165" rx="10" ry="6" fill="#E5E7EB" stroke="#94A3B8" stroke-width="1"/>
  <ellipse cx="55" cy="188" rx="10" ry="6" fill="#E5E7EB" stroke="#94A3B8" stroke-width="1"/>
  <!-- Dark moths (few, visible) -->
  <ellipse cx="85" cy="155" rx="10" ry="6" fill="#1E293B" stroke="#374151" stroke-width="1"/><text x="102" y="158" font-size="9" fill="#374151">Dark (visible)</text>
  <!-- Dark bark (post-industrial) -->
  <rect x="162" y="88" width="118" height="200" rx="6" fill="#292524"/>
  <text x="221" y="108" text-anchor="middle" font-size="10" fill="white">Dark bark</text>
  <!-- Dark moths survive -->
  <ellipse cx="185" cy="140" rx="10" ry="6" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/><text x="202" y="143" font-size="9" fill="#A8A29E">Dark (hidden)</text>
  <ellipse cx="185" cy="165" rx="10" ry="6" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <ellipse cx="185" cy="188" rx="10" ry="6" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
  <!-- Light moths eaten -->
  <ellipse cx="215" cy="155" rx="10" ry="6" fill="#E5E7EB" stroke="#EF4444" stroke-width="1.5"/><text x="232" y="155" font-size="9" fill="#EF4444">× eaten</text>
  <text x="160" y="310" text-anchor="middle" font-size="10" fill="#374151">Survival of the fittest!</text>
  <!-- Allele frequency graph (right) -->
  <rect x="320" y="52" width="300" height="200" rx="12" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="470" y="76" text-anchor="middle" font-size="12" font-weight="800" fill="#C2410C">Allele Frequency Over Generations</text>
  <line x1="340" y1="236" x2="602" y2="236" stroke="#374151" stroke-width="1.5"/>
  <line x1="340" y1="88" x2="340" y2="240" stroke="#374151" stroke-width="1.5"/>
  <!-- p (dominant dark) increasing -->
  <path d="M344,220 Q380,215 420,195 Q460,170 500,148 Q540,128 596,114" fill="none" stroke="#374151" stroke-width="2.5"/>
  <text x="560" y="108" font-size="10" fill="#374151">p (dark)</text>
  <!-- q (light) decreasing -->
  <path d="M344,100 Q380,110 420,128 Q460,152 500,172 Q540,195 596,214" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="560" y="224" font-size="10" fill="#94A3B8">q (light)</text>
  <text x="470" y="258" text-anchor="middle" font-size="10" fill="#374151">Generations →</text>
  <!-- Darwin's 4 postulates -->
  <rect x="320" y="270" width="300" height="118" rx="12" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="470" y="292" text-anchor="middle" font-size="12" font-weight="800" fill="#C2410C">Darwin's 4 Postulates</text>
  <text x="470" y="314" text-anchor="middle" font-size="10" fill="#374151">1. Variation exists in populations</text>
  <text x="470" y="334" text-anchor="middle" font-size="10" fill="#374151">2. Traits are heritable</text>
  <text x="470" y="354" text-anchor="middle" font-size="10" fill="#374151">3. More offspring than can survive</text>
  <text x="470" y="374" text-anchor="middle" font-size="10" fill="#374151">4. Fittest individuals survive and reproduce</text>
</svg>