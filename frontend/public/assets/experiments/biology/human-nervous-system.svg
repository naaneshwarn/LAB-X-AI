<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#C2410C">Human Nervous System &amp; Reflex Arc</text>
  <!-- Brain -->
  <ellipse cx="200" cy="98" rx="80" ry="68" fill="#FB923C" fill-opacity="0.8" stroke="#C2410C" stroke-width="2.5"/>
  <!-- Brain hemispheres fold -->
  <path d="M130,100 Q160,80 200,88 Q240,80 270,100" fill="none" stroke="#C2410C" stroke-width="1.5"/>
  <path d="M128,112 Q160,96 200,104 Q240,96 272,112" fill="none" stroke="#C2410C" stroke-width="1.5"/>
  <text x="200" y="90" text-anchor="middle" font-size="13" font-weight="800" fill="white">Brain</text>
  <text x="175" y="108" text-anchor="middle" font-size="9" fill="white">Cerebrum</text>
  <text x="225" y="128" text-anchor="middle" font-size="9" fill="white">Cerebellum</text>
  <!-- Cerebellum bump -->
  <ellipse cx="225" cy="145" rx="30" ry="22" fill="#EA580C" stroke="#C2410C" stroke-width="1.5"/>
  <!-- Brain stem -->
  <rect x="186" y="160" width="28" height="40" rx="6" fill="#D97706" stroke="#B45309" stroke-width="2"/>
  <text x="200" y="184" text-anchor="middle" font-size="9" fill="white">Brain stem</text>
  <!-- Spinal cord -->
  <rect x="192" y="200" width="16" height="160" rx="6" fill="#FCD34D" stroke="#D97706" stroke-width="2"/>
  <text x="218" y="290" font-size="9" fill="#374151">Spinal cord</text>
  <!-- Spinal nerves branching off -->
  <line x1="192" y1="230" x2="145" y2="240" stroke="#FB923C" stroke-width="2"/>
  <line x1="208" y1="230" x2="255" y2="240" stroke="#FB923C" stroke-width="2"/>
  <line x1="192" y1="265" x2="140" y2="275" stroke="#FB923C" stroke-width="2"/>
  <line x1="208" y1="265" x2="260" y2="275" stroke="#FB923C" stroke-width="2"/>
  <line x1="192" y1="300" x2="145" y2="310" stroke="#FB923C" stroke-width="2"/>
  <line x1="208" y1="300" x2="255" y2="310" stroke="#FB923C" stroke-width="2"/>
  <!-- REFLEX ARC (right side) -->
  <text x="470" y="52" text-anchor="middle" font-size="13" font-weight="800" fill="#C2410C">Reflex Arc</text>
  <!-- Receptor -->
  <circle cx="380" cy="340" r="20" fill="#FBBF24" stroke="#D97706" stroke-width="2"/>
  <text x="380" y="344" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E">Receptor</text>
  <!-- Sensory neuron -->
  <path d="M380,320 Q390,290 400,255 Q408,235 420,215" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <text x="354" y="275" font-size="9" fill="#1D4ED8">Sensory</text>
  <text x="354" y="287" font-size="9" fill="#1D4ED8">neuron</text>
  <!-- Synapse / spinal cord relay -->
  <circle cx="420" cy="208" r="18" fill="#A78BFA" stroke="#6D28D9" stroke-width="2"/>
  <text x="420" y="207" text-anchor="middle" font-size="8" font-weight="700" fill="white">Relay</text>
  <text x="420" y="218" text-anchor="middle" font-size="8" fill="white">neuron</text>
  <!-- Motor neuron -->
  <path d="M420,190 Q430,170 450,145 Q462,130 475,115" fill="none" stroke="#EF4444" stroke-width="2.5"/>
  <text x="468" y="150" font-size="9" fill="#B91C1C">Motor</text>
  <text x="468" y="162" font-size="9" fill="#B91C1C">neuron</text>
  <!-- Effector -->
  <rect x="460" y="88" width="60" height="30" rx="8" fill="#34D399" stroke="#059669" stroke-width="2"/>
  <text x="490" y="107" text-anchor="middle" font-size="9" font-weight="700" fill="white">Effector (muscle)</text>
  <!-- Action potential graph -->
  <rect x="488" y="200" width="140" height="90" rx="8" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="558" y="220" text-anchor="middle" font-size="10" font-weight="700" fill="#C2410C">Action Potential</text>
  <line x1="500" y1="278" x2="618" y2="278" stroke="#374151" stroke-width="1.5"/>
  <line x1="500" y1="225" x2="500" y2="282" stroke="#374151" stroke-width="1.5"/>
  <path d="M504,274 L520,274 L530,230 L540,274 L560,274 L565,274 L570,274" fill="none" stroke="#EF4444" stroke-width="2"/>
  <text x="522" y="290" text-anchor="middle" font-size="8" fill="#374151">Depol. → Repol.</text>
  <!-- Summary box -->
  <rect x="488" y="308" width="140" height="80" rx="8" fill="white" fill-opacity="0.9" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="558" y="328" text-anchor="middle" font-size="10" font-weight="700" fill="#C2410C">Reflex time:</text>
  <text x="558" y="348" text-anchor="middle" font-size="12" font-weight="800" fill="#EA580C">~50 ms</text>
  <text x="558" y="368" text-anchor="middle" font-size="10" fill="#374151">bypasses brain!</text>
</svg>