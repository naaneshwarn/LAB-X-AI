<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#4C1D95">Mendelian Genetics &amp; Punnett Square</text>
  <!-- Parent cross -->
  <text x="200" y="58" text-anchor="middle" font-size="14" font-weight="800" fill="#6D28D9">Rr × Rr</text>
  <text x="200" y="78" text-anchor="middle" font-size="12" fill="#374151">(Monohybrid Cross)</text>
  <!-- Punnett square -->
  <rect x="80" y="90" width="240" height="240" rx="4" fill="white" fill-opacity="0.9" stroke="#7C3AED" stroke-width="2.5"/>
  <!-- Grid lines -->
  <line x1="200" y1="90" x2="200" y2="330" stroke="#7C3AED" stroke-width="2"/>
  <line x1="80" y1="210" x2="320" y2="210" stroke="#7C3AED" stroke-width="2"/>
  <line x1="80" y1="150" x2="320" y2="150" stroke="#A78BFA" stroke-width="1.5"/>
  <line x1="140" y1="90" x2="140" y2="330" stroke="#A78BFA" stroke-width="1.5"/>
  <!-- Parent gametes -->
  <text x="110" y="122" text-anchor="middle" font-size="20" font-weight="800" fill="#6D28D9">R</text>
  <text x="260" y="122" text-anchor="middle" font-size="20" font-weight="800" fill="#6D28D9">r</text>
  <text x="55" y="185" text-anchor="middle" font-size="20" font-weight="800" fill="#6D28D9">R</text>
  <text x="55" y="275" text-anchor="middle" font-size="20" font-weight="800" fill="#6D28D9">r</text>
  <!-- Punnett results -->
  <text x="170" y="185" text-anchor="middle" font-size="18" font-weight="800" fill="#EF4444">RR</text>
  <text x="265" y="185" text-anchor="middle" font-size="18" font-weight="800" fill="#EF4444">Rr</text>
  <text x="170" y="275" text-anchor="middle" font-size="18" font-weight="800" fill="#EF4444">Rr</text>
  <text x="265" y="275" text-anchor="middle" font-size="18" font-weight="800" fill="#6D28D9">rr</text>
  <!-- Background coloring for phenotypes -->
  <rect x="82" y="152" width="116" height="56" rx="2" fill="#EF4444" fill-opacity="0.2"/>
  <rect x="202" y="152" width="116" height="56" rx="2" fill="#EF4444" fill-opacity="0.2"/>
  <rect x="82" y="212" width="116" height="116" rx="2" fill="#EF4444" fill-opacity="0.2"/>
  <rect x="202" y="212" width="116" height="116" rx="2" fill="#A78BFA" fill-opacity="0.2"/>
  <!-- Phenotype legend -->
  <rect x="80" y="346" width="240" height="40" rx="8" fill="white" fill-opacity="0.88" stroke="#DDD6FE" stroke-width="1.5"/>
  <rect x="90" y="358" width="14" height="14" rx="2" fill="#EF4444" fill-opacity="0.3"/><text x="110" y="369" font-size="10" fill="#374151">Red flower: RR, Rr (3/4)</text>
  <rect x="200" y="358" width="14" height="14" rx="2" fill="#A78BFA" fill-opacity="0.4"/><text x="220" y="369" font-size="10" fill="#374151">White: rr (1/4)</text>
  <!-- Results right panel -->
  <rect x="358" y="52" width="260" height="320" rx="12" fill="white" fill-opacity="0.9" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="488" y="78" text-anchor="middle" font-size="13" font-weight="800" fill="#4C1D95">Mendelian Ratios</text>
  <text x="488" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">Genotypic Ratio</text>
  <text x="488" y="124" text-anchor="middle" font-size="12" fill="#374151">1 RR : 2 Rr : 1 rr</text>
  <text x="488" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">Phenotypic Ratio</text>
  <text x="488" y="174" text-anchor="middle" font-size="12" fill="#374151">3 Red : 1 White</text>
  <text x="488" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">Mendel's Laws</text>
  <text x="488" y="226" text-anchor="middle" font-size="10" fill="#374151">1. Law of Dominance</text>
  <text x="488" y="246" text-anchor="middle" font-size="10" fill="#374151">R (Red) dominant over r (white)</text>
  <text x="488" y="270" text-anchor="middle" font-size="10" fill="#374151">2. Law of Segregation</text>
  <text x="488" y="290" text-anchor="middle" font-size="10" fill="#374151">Alleles separate during</text>
  <text x="488" y="308" text-anchor="middle" font-size="10" fill="#374151">gamete formation</text>
  <text x="488" y="332" text-anchor="middle" font-size="10" fill="#374151">3. Law of Ind. Assortment</text>
  <text x="488" y="352" text-anchor="middle" font-size="10" fill="#374151">Different genes assort</text>
  <text x="488" y="368" text-anchor="middle" font-size="10" fill="#374151">independently</text>
</svg>