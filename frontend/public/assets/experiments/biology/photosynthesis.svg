<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="12"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#14532D">Photosynthesis &amp; Limiting Factors</text>
  <!-- Sun -->
  <circle cx="80" cy="80" r="45" fill="#FEF08A" stroke="#FBBF24" stroke-width="3"/>
  <text x="80" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#D97706">Sun</text>
  <text x="80" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#D97706">Light ☀</text>
  <!-- Light rays -->
  <line x1="118" y1="62" x2="175" y2="118" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="6,3"/>
  <line x1="124" y1="78" x2="185" y2="150" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="118" y1="98" x2="175" y2="175" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Leaf -->
  <path d="M200,310 Q180,250 220,180 Q260,110 300,100 Q340,110 360,160 Q380,210 350,270 Q320,330 280,340 Q240,350 200,310 Z" fill="#22C55E" stroke="#15803D" stroke-width="3"/>
  <!-- Leaf veins -->
  <path d="M235,315 Q268,230 300,110" fill="none" stroke="#15803D" stroke-width="2.5"/>
  <path d="M235,315 Q255,260 290,160 Q300,110 300,110" fill="none" stroke="#15803D" stroke-width="1.5"/>
  <path d="M300,110 Q320,160 340,205 Q350,250 335,300" fill="none" stroke="#15803D" stroke-width="1.5"/>
  <path d="M270,215 Q280,220 310,218" fill="none" stroke="#15803D" stroke-width="1.5"/>
  <path d="M252,260 Q270,264 302,262" fill="none" stroke="#15803D" stroke-width="1.5"/>
  <!-- Stomata at leaf bottom -->
  <ellipse cx="230" cy="318" rx="8" ry="5" fill="#059669"/>
  <ellipse cx="260" cy="330" rx="8" ry="5" fill="#059669"/>
  <ellipse cx="290" cy="334" rx="8" ry="5" fill="#059669"/>
  <text x="258" y="354" text-anchor="middle" font-size="9" font-weight="700" fill="#065F46">Stomata (CO₂ in, O₂ out)</text>
  <!-- CO2 arrows in -->
  <text x="88" y="210" font-size="12" font-weight="700" fill="#374151">CO₂ →</text>
  <line x1="130" y1="208" x2="190" y2="240" stroke="#374151" stroke-width="2"/>
  <!-- O2 bubbles out -->
  <circle cx="380" cy="150" r="12" fill="#BAE6FD" fill-opacity="0.8" stroke="#38BDF8" stroke-width="2"/>
  <text x="380" y="154" text-anchor="middle" font-size="9" font-weight="700" fill="#0369A1">O₂</text>
  <circle cx="405" cy="130" r="10" fill="#BAE6FD" fill-opacity="0.8" stroke="#38BDF8" stroke-width="2"/>
  <text x="405" y="134" text-anchor="middle" font-size="8" fill="#0369A1">O₂</text>
  <circle cx="395" cy="175" r="8" fill="#BAE6FD" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1.5"/>
  <!-- Water absorbed from roots -->
  <path d="M270,370 Q272,380 274,392" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <text x="274" y="397" text-anchor="middle" font-size="9" font-weight="700" fill="#0369A1">H₂O (from roots)</text>
  <!-- Equation -->
  <rect x="430" y="52" width="192" height="100" rx="12" fill="#14532D"/>
  <text x="526" y="78" text-anchor="middle" font-size="11" font-weight="800" fill="white">Photosynthesis Equation</text>
  <text x="526" y="102" text-anchor="middle" font-size="10" fill="#86EFAC">6CO₂ + 6H₂O</text>
  <text x="526" y="118" text-anchor="middle" font-size="12" font-weight="800" fill="#FBBF24">→ C₆H₁₂O₆ + 6O₂</text>
  <text x="526" y="140" text-anchor="middle" font-size="10" fill="#86EFAC">Requires light energy</text>
  <!-- Graph: O2 rate vs light -->
  <rect x="430" y="175" width="192" height="140" rx="10" fill="white" fill-opacity="0.9" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="526" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#14532D">O₂ Rate vs Light</text>
  <line x1="445" y1="302" x2="604" y2="302" stroke="#374151" stroke-width="1.5"/>
  <line x1="445" y1="210" x2="445" y2="306" stroke="#374151" stroke-width="1.5"/>
  <path d="M448,302 Q460,295 480,270 Q510,235 540,218 Q570,210 598,208" fill="none" stroke="#22C55E" stroke-width="2.5"/>
  <line x1="560" y1="206" x2="600" y2="206" stroke="#22C55E" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="556" y="200" text-anchor="middle" font-size="8" fill="#374151">light sat.</text>
  <text x="456" y="314" font-size="9" fill="#374151">Light intensity →</text>
  <!-- Chloroplast inset -->
  <rect x="430" y="332" width="192" height="52" rx="8" fill="#DCFCE7" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="526" y="352" text-anchor="middle" font-size="10" font-weight="700" fill="#14532D">In Chloroplast:</text>
  <text x="526" y="370" text-anchor="middle" font-size="10" fill="#374151">Light → ATP → Calvin cycle → Glucose</text>
</svg>